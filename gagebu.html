<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>권능·가영 가계부 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff;--bg2:#f5f5f5;--bg3:#e8e8e8;
  --text:#1a1a1a;--text2:#666;--text3:#aaa;
  --border:#e0e0e0;--border2:#ccc;
  --r:10px;--r-sm:7px;
  --green-bg:#eaf3de;--green:#3b6d11;
  --red-bg:#fcebeb;--red:#c0392b;
  --accent:#2d2d2d;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
  --text:#f0f0f0;--text2:#aaa;--text3:#555;
  --border:#3a3a3c;--border2:#555;
  --green-bg:#1a3a12;--green:#8fd46a;
  --red-bg:#3b1a1a;--red:#e08080;
  --accent:#e0e0e0;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);min-height:100vh}
.app{max-width:420px;margin:0 auto;min-height:100vh}
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.header h1{font-size:15px;font-weight:600;margin-bottom:12px}
.month-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.month-tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 14px;border-radius:var(--r-sm) var(--r-sm) 0 0;font-size:13px;color:var(--text2);cursor:pointer;border:1px solid transparent;border-bottom:none;background:transparent;white-space:nowrap}
.tab.active{background:var(--bg);border-color:var(--border);color:var(--text);font-weight:600}
.section{padding:12px 14px 40px}
.income-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.income-row{display:flex;align-items:center;padding:10px 13px;border-bottom:1px solid var(--border)}
.income-row:last-child{border-bottom:none}
.income-label{font-size:12px;color:var(--text2);width:90px;flex-shrink:0}
.income-input{flex:1;border:none;background:transparent;font-size:15px;font-weight:500;text-align:right;color:var(--text);outline:none;font-family:inherit}
.income-unit{font-size:12px;color:var(--text3);margin-left:3px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.card.green{background:var(--green-bg);border-color:transparent}
.card.red{background:var(--red-bg);border-color:transparent}
.card-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.card.green .card-label,.card.red .card-label{opacity:.7}
.card-val{font-size:18px;font-weight:700;letter-spacing:-.5px}
.card.green .card-val{color:var(--green)}
.card.red .card-val{color:var(--red)}
.card-sub{font-size:11px;color:var(--text3);margin-top:3px}
.toggle-row{display:flex;gap:6px;margin-bottom:12px}
.toggle-btn{flex:1;padding:8px 4px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12px;background:var(--bg);cursor:pointer;color:var(--text2);font-family:inherit}
.toggle-btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
.sec-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.add-btn{background:var(--bg);border:1px solid var(--border2);border-radius:var(--r-sm);padding:5px 12px;font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;font-weight:500}
.add-form{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.add-form.edit-mode{border-color:var(--accent);border-width:2px}
.form-row{margin-bottom:9px}
.form-row label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-row input,.form-row select{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.form-row input:focus,.form-row select:focus{border-color:var(--accent)}
.form-actions{display:flex;gap:7px;margin-top:12px}
.btn-save{flex:1;padding:10px;background:var(--accent);color:var(--bg);border:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-cancel{padding:10px 15px;background:transparent;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit}
.expense-list{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.day-head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:12px}
.day-head .dh-day{color:var(--text);font-weight:700}
.day-head .dh-day.sun{color:#e5484d} .day-head .dh-day.sat{color:#3b7fe0}
.day-head .dh-sum{color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}
.expense-item{display:block;border-bottom:1px solid var(--border)}
.expense-item:last-child{border-bottom:none}
.exp-main{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;transition:background .12s}
.expense-item.actopen .exp-main{background:var(--bg2)}
.exp-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.exp-name{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-cat{align-self:flex-start;font-size:10px;font-weight:600;padding:1px 8px;border-radius:99px;line-height:1.5;background:var(--bg2);color:var(--text2)}
.expense-item.actopen .exp-cat{background:var(--bg)}
.exp-amt{font-size:15px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:5px;color:var(--text);font-variant-numeric:tabular-nums}
.exp-amt.refund,.exp-amt.inc{color:var(--green)}
.exp-cat.inc{background:var(--green-bg);color:var(--green)}
.dh-sum.inc{color:var(--green)}
.exp-caret{font-size:9px;color:var(--text3);font-weight:400}
.exp-actions{display:flex;gap:6px;padding:2px 12px 12px}
.exp-actions .icon-btn{flex:1;padding:9px 4px;text-align:center;font-weight:600}
.icon-btn{background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-size:12px;padding:5px 9px;font-family:inherit;transition:filter .12s}
.icon-btn:active{filter:brightness(.94)}
.icon-btn.star{color:#b0870a} .icon-btn.copy{color:#1971c2} .icon-btn.edit{color:var(--text)}
.icon-btn.del{color:#e5484d;background:var(--red-bg);border-color:transparent}
.empty{text-align:center;padding:36px 16px;color:var(--text3);font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r)}
.empty-icon{font-size:28px;margin-bottom:8px}
.cat-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.cat-row{margin-bottom:12px}
.cat-row:last-child{margin-bottom:0}
.cat-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.cat-pct{font-size:11px;color:var(--text3)}
.bar-bg{background:var(--bg3);border-radius:3px;height:7px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:3px}
.fixed-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.fixed-header{padding:8px 13px;background:var(--bg2);font-size:11px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.fixed-item{display:flex;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border);font-size:13px;gap:8px}
.fixed-item:last-child{border-bottom:none}
.fixed-name{flex:1}
.fixed-input{border:1px solid var(--border2);border-radius:var(--r-sm);padding:5px 9px;font-size:13px;font-weight:500;text-align:right;width:120px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.fixed-input:focus{border-color:var(--accent)}
.fixed-unit{font-size:11px;color:var(--text3);flex-shrink:0}
.fixed-total-row{display:flex;justify-content:space-between;padding:10px 13px;font-size:13px;font-weight:600}
.saving-label{color:var(--green)}
.save-bar{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.save-hint{font-size:12px;color:var(--text2)}
.btn-fixed-save{background:var(--accent);color:var(--bg);border:none;border-radius:var(--r-sm);padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.import-panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.import-drop{border:1.5px dashed var(--border2);border-radius:var(--r);padding:20px 12px;text-align:center;color:var(--text2);cursor:pointer;background:var(--bg2);line-height:1.6}
.import-drop.busy{pointer-events:none;opacity:.65}
.import-status{font-size:12px;color:var(--text2);margin-top:9px;line-height:1.5}
.vision-row{margin-bottom:10px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg2)}
.vision-row.on{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.vision-link{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;font-family:inherit}
.import-raw{margin-top:9px;font-size:12px;color:var(--text2)}
.import-raw summary{cursor:pointer;padding:4px 0}
.import-raw pre{white-space:pre-wrap;word-break:break-all;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px;max-height:220px;overflow:auto;font-size:11px;line-height:1.5}
.import-preview{margin-top:10px;border-top:1px solid var(--border)}
.batch-panel .import-top{grid-template-columns:1fr auto}
.batch-panel .ii-name{padding:8px 10px;font-size:13px}
.batch-panel .ii-del{flex-shrink:0;width:34px;height:34px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg);color:var(--text2);cursor:pointer;font-size:14px;line-height:1}
.add-row-btn{width:100%;margin-top:8px;padding:9px;border:1.5px dashed var(--border2);border-radius:var(--r-sm);background:var(--bg2);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.add-btn.on{background:var(--accent);color:var(--bg)}
.sel-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 10px;padding:9px 12px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-sm);font-size:13px}
.add-btn.del{background:#e5484d;color:#fff;border-color:#e5484d}
.expense-item.selmode{cursor:pointer;align-items:center}
.expense-item.selon{background:var(--bg2)}
.sel-box{width:20px;height:20px;flex-shrink:0;margin-right:10px;accent-color:var(--accent)}
/* 요약(머니 플로우) 뷰 */
.sm{padding-top:4px}
.sm-top{text-align:center;font-size:13px;color:var(--text2);margin-bottom:12px}
.sm-note{color:var(--accent)}
.sm-hero{background:var(--bg2);border:1.5px solid var(--border2);border-radius:14px;padding:14px;text-align:center;margin-bottom:14px}
.sm-hero .l{font-size:12px;color:var(--text2);font-weight:600}
.sm-hero .big{font-size:26px;font-weight:800;color:var(--accent);margin:5px 0}
.sm-hero .rate{border-top:1px dashed var(--border2);margin-top:8px;padding-top:8px;font-size:13px;color:var(--text2)}
.sm-hero .rate b{font-size:18px;color:var(--accent)}
.sm-flow{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center;margin-bottom:14px}
.sm-lab{font-size:12px;font-weight:800;margin:0 0 6px 2px}
.sm-lab.in{color:#2f6bff} .sm-lab.out{color:#e5484d}
.sm-node{display:flex;justify-content:space-between;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:7px 9px;margin-bottom:6px;font-size:11px}
.sm-node span{color:var(--text2)} .sm-node b{font-size:12px}
.sm-node.muted{justify-content:center;color:var(--text3)}
.sm-hub{width:92px;height:92px;border-radius:50%;background:var(--bg2);border:2px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:0 auto}
.sm-hub .n{font-size:11px;color:var(--text2)} .sm-hub .v{font-size:13px;font-weight:800;color:var(--text);margin-top:2px;padding:0 4px}
.sm-grp{display:flex;justify-content:space-between;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.sm-grp span{font-weight:700;font-size:12px} .sm-grp b{font-size:13px;color:#e5484d}
.sm-brk{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:4px 12px;margin-bottom:11px}
.sm-brk .hd{font-size:12px;font-weight:800;color:var(--text2);padding:8px 0 4px}
.sm-brk .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.sm-brk .row:last-child{border-bottom:none}
.sm-brk .row.muted{color:var(--text3);justify-content:center}
.sm-brk .row.clickable{cursor:pointer}
.sm-brk .row.clickable span{font-weight:600}
.sm-sub{background:var(--bg2);border-radius:8px;margin:0 -4px 6px;padding:2px 10px}
.sm-subrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
.sm-subrow:last-child{border-bottom:none}
.sm-subrow b{color:var(--text);font-weight:700}
.sm-subrow.muted{justify-content:center;color:var(--text3)}
.sm-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sm-bar .b{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px;text-align:center}
.sm-bar .b.clickable{cursor:pointer;border-style:dashed;border-color:var(--accent)}
.sm-bar .b .n{font-size:11px;color:var(--text2)} .sm-bar .b .v{font-weight:800;font-size:15px;margin-top:3px}
.sm-bar .blue{color:#2f6bff} .sm-bar .red{color:#e5484d} .sm-bar .green{color:#12a150} .sm-bar .purple{color:#8e5bd8}
.import-item{display:block;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.import-item:last-child{border-bottom:none}
.import-item input[type=checkbox]{width:17px;height:17px}
.import-meta{color:var(--text3);font-size:11px;margin-top:2px}
.import-amt{font-weight:650;white-space:nowrap}
.import-top{display:grid;grid-template-columns:22px 1fr auto;gap:7px;align-items:center}
.import-name{min-width:0}
.import-edit{display:flex;gap:6px;margin:7px 0 0 29px}
.import-edit select,.import-edit input{flex:1;min-width:0;padding:5px 7px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.import-edit .ii-date{flex:1.3}
.import-item.off{opacity:.5}
.import-modes{display:flex;gap:6px;margin-bottom:10px}
.imode{flex:1;padding:7px 4px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.imode.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.import-textarea{width:100%;min-height:120px;padding:10px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;line-height:1.6;box-sizing:border-box}
.import-preview-head{font-size:11px;color:var(--text3);padding:8px 0 2px}
.import-top .ii-name{min-width:0;padding:5px 7px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12px;font-weight:600;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.import-top .ii-kind{flex-shrink:0;width:58px;padding:5px 4px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.yr-list{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.yr-row{padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer}
.yr-row:last-child{border-bottom:none}
.yr-row.cur{background:var(--bg2)}
.yr-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.yr-mon{font-weight:600}
.yr-nums{font-size:11px;color:var(--text3)}
.yr-bar-bg{background:var(--bg3);border-radius:3px;height:6px;overflow:hidden}
.yr-bar-fill{height:100%;background:var(--red);opacity:.75;border-radius:3px}
.yr-delta{font-size:11px;margin-left:6px}
.fav-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 0 10px}
.fav-bar::-webkit-scrollbar{display:none}
.fav-lead{flex-shrink:0;font-size:11px;color:var(--text2);font-weight:600}
.fav-chip{flex-shrink:0;white-space:nowrap;padding:6px 11px;border:1px solid var(--border2);border-radius:99px;background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
.fav-chip b{font-weight:700}
.fav-manage{flex-shrink:0;padding:6px 10px;border:1px dashed var(--border2);border-radius:99px;background:transparent;color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit}
.prevcopy-btn{width:100%;padding:9px;margin-bottom:10px;border:1px dashed var(--border2);border-radius:var(--r-sm);background:var(--bg);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit}
.filter-bar{display:flex;gap:6px;margin-bottom:8px}
.filter-search{flex:1;min-width:0;padding:8px 11px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.filter-cat{flex-shrink:0;width:110px;padding:8px 8px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.icon-btn.copy{color:var(--text2)}
.icon-btn.star{color:#c99700;border-color:transparent}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h1 id="appTitle" style="font-size:15px;font-weight:600">📒 권능·가영 가계부</h1>
      <div style="display:flex;align-items:center;gap:8px">
        <select id="yearSel" onchange="setYear(this.value)" style="font-size:13px;font-weight:600;padding:4px 8px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font-family:inherit;outline:none;cursor:pointer"></select>
        <button onclick="resetRoom()" style="background:none;border:none;font-size:11px;color:var(--text3);cursor:pointer;padding:4px 4px;font-family:inherit">재설정</button>
      </div>
    </div>
    <div class="month-tabs" id="tabs"></div>
  </div>
  <div class="section" id="content"></div>
</div>

// ── 연도 전환 ─────────────────────────────────────────────────
// 데이터 키는 "보고 있는 연도"의 끝 2자리로 생성한다 (2026→'26', 2027→'27').
// YEAR/YY는 연도 선택 버튼으로 바뀌는 가변값. 2026을 보면 YY==='26' →
// 기존 키(e26_, fg26, cats26 ...)를 그대로 읽으므로 기존 데이터가 그대로 보존된다.
const CUR_YEAR=new Date().getFullYear();   // 실제 올해(기본 선택값)
let YEAR=CUR_YEAR;                          // 현재 화면에 보고 있는 연도
let YY=String(YEAR).slice(-2);
// 설정성 데이터(항목/고정지출/저축 목록)는 해당 연도 값이 없으면 직전 연도에서 이월(읽기 전용 복제).
function cfgFallback(base,def){
  if(liveData[base+YY]!=null) return liveData[base+YY];          // 그 연도 값이 있으면 그대로
  for(let y=YEAR-1;y>=2026;y--){                                  // 없으면 직전 연도부터 역순 탐색
    const pk=base+String(y).slice(-2);
    if(liveData[pk]!=null) return JSON.parse(JSON.stringify(liveData[pk])); // 복제(원본 보존)
  }
  return JSON.parse(JSON.stringify(def)); // 기본 상수도 복제해 반환(원본 DEF_* 변형 방지)
}
// 선택 가능한 연도 목록(데이터에 존재하는 연도 + 올해 + 내년)
function availableYears(){
  const set=new Set([CUR_YEAR,CUR_YEAR+1]);
  Object.keys(liveData||{}).forEach(k=>{
    const mm=k.match(/^(?:cats|fgm|sgm|ia|fg|sg|e)(\d\d)(?:_|$)/);
    if(mm) set.add(2000+parseInt(mm[1],10));
  });
  return [...set].sort((a,b)=>a-b);
}
// 연도 전환: 방 전체가 이미 liveData에 로드돼 있으므로 키 접두(YY)만 바꾸고 다시 그린다.
function setYear(y){

  render();
}

// ── 고유 ID + HTML 이스케이프(XSS 방지) ───────────────────────
function genId(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
// id 없는 기존 항목에 id 부여(하위호환). 하나라도 부여했으면 true.
function ensureIds(arr,prefix){
  if(!Array.isArray(arr)) return false;
  let changed=false;
  for(let i=0;i<arr.length;i++){
    if(arr[i] && arr[i].id==null){arr[i].id=genId(prefix)+i;changed=true;}
  }
  return changed;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── 데이터 읽기/쓰기 ─────────────────────────────────────────
// 고정지출/저축의 "항목 목록"(이름·태그·기준금액)은 모든 달이 공통 공유한다.
function getFixedItems(){return cfgFallback('fg',DEF_FIXED);}
function getSavItems(){return cfgFallback('sg',DEF_SAVINGS);}
// 각 항목의 "금액"은 달마다 따로 저장한다: fgm<YY>_<m> = {항목id: 금액}.
// 그 달 저장값이 없으면 직전 달 → … → 기준금액(목록의 amt) 순으로 이월(복사)한다.
function monthAmtMap(base,m){
  if(liveData[base+YY+'_'+m]!=null) return liveData[base+YY+'_'+m]; // 그 달 저장값
  for(let mm=m-1;mm>=0;mm--){                                        // 직전 달부터 역순
    if(liveData[base+YY+'_'+mm]!=null) return liveData[base+YY+'_'+mm];
  }
  return null;                                                       // 없으면 기준금액 사용
}
function resolveAmts(items,base,m){
  const map=monthAmtMap(base,m);
  return items.map(it=>({...it, amt:(map&&map[it.id]!=null)?map[it.id]:(Number(it.amt)||0)}));
}
function getFixedForMonth(m){return resolveAmts(getFixedItems(),'fgm',m);}
function getSavForMonth(m){return resolveAmts(getSavItems(),'sgm',m);}
function getIncArr(m){return liveData['ia'+YY+'_'+m]||[];}
function getExps(m){return liveData['e'+YY+'_'+m]||[];}
function ft(m){if(m==null)m=S.month;return getFixedForMonth(m).reduce((s,i)=>s+(Number(i.amt)||0),0);}
function st(m){if(m==null)m=S.month;return getSavForMonth(m).reduce((s,i)=>s+(Number(i.amt)||0),0);}

function fbSet(key,val){
  liveData[key]=val; // 즉시 로컬 반영
  if(db&&ROOM) db.ref(`budgets/${ROOM}/${key}`).set(val);
}
// ── 동시 편집 유실 방지(트랜잭션) ─────────────────────────────
// 월별 지출/수입은 배열이라, 통째로 set()하면 두 사람이 같은 달을 동시에
// 편집할 때 나중 저장이 먼저 저장을 덮어써 유실된다.
// 그래서 "id 기반 연산(op)"을 Firebase 트랜잭션으로 서버 최신값에 재적용한다.
// op는 (배열)→(새 배열) 순수 함수여야 하고 id 기준으로 멱등해야 한다.
function txArr(key,op){
  const norm=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]);
  liveData[key]=op(norm(liveData[key]));                 // 낙관적 로컬 반영
  if(db&&ROOM){
    const ref=db.ref(`budgets/${ROOM}/${key}`);
    ref.transaction(cur=>op(norm(cur)))                  // 서버 최신값에 다시 적용 → 상대 변경 보존
      .catch(e=>{                                        // 실패 시 서버값으로 로컬 롤백
        console.error('저장 실패',e);
        ref.once('value',s=>{liveData[key]=s.val();if(!S.showForm&&!S.showIncForm)render();});
      });
  }
}
function applyExps(m,op){txArr('e'+YY+'_'+m,op);}
function applyInc(m,op){txArr('ia'+YY+'_'+m,op);}
// 자주 쓰는 항목(즐겨찾기): 방 공통·연도 무관. 트랜잭션으로 동시편집 안전.

function initFirebase(){
  if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
  firebase.auth().signInAnonymously().catch(e=>console.error('익명 로그인 실패',e));
  db=firebase.database();
  // 기존 localStorage 데이터 Firebase로 마이그레이션
  db.ref(`budgets/${ROOM}`).once('value',snap=>{
    if(!snap.val()){
      const mig={};let has=false;
      const keys=['fg'+YY,'sg'+YY,'cats'+YY];
      for(let m=0;m<12;m++){keys.push('e'+YY+'_'+m);keys.push('ia'+YY+'_'+m);}
      // 레거시 2026 localStorage 키도 함께 스캔(데이터 유실 방지)
      if(YY!=='26'){
        keys.push('fg26','sg26','cats26');
        for(let m=0;m<12;m++){keys.push('e26_'+m);keys.push('ia26_'+m);}
      }
      keys.forEach(k=>{
        try{const v=localStorage.getItem(k);if(v){mig[k]=JSON.parse(v);has=true;}}catch(e){}
      });
      if(has){db.ref(`budgets/${ROOM}`).set(mig);console.log('기존 데이터 이전 완료');}
    }
    // 실시간 리스닝
    db.ref(`budgets/${ROOM}`).on('value',s=>{
      liveData=s.val()||{};
      migrateIds();           // id 없는 기존 항목에 id 부여(1회성, 수렴 후 추가 쓰기 없음)
      syncVisionKeyToRoom();  // 로컬에만 있는 비전 키를 방으로 자동 이전(전 기기 공유)
      if(!S.showForm&&!S.showIncForm) render();
    });
  });
}

// id 없는 기존 지출/수입 항목에 고유 id를 부여하고 변경분만 Firebase에 저장.
// 모든 항목에 id가 생기면 더 이상 쓰기가 발생하지 않아 무한 루프 없음.
function migrateIds(){
  if(!db||!ROOM) return;
  for(let m=0;m<12;m++){
    const ek='e'+YY+'_'+m, ik='ia'+YY+'_'+m;
    if(ensureIds(liveData[ek],'x')) db.ref(`budgets/${ROOM}/${ek}`).set(liveData[ek]);
    if(ensureIds(liveData[ik],'n')) db.ref(`budgets/${ROOM}/${ik}`).set(liveData[ik]);
  }
}

function fmt(n){return Math.abs(Math.round(n)).toLocaleString('ko-KR')+'원';}
function fmtS(n){
  const a=Math.abs(Math.round(n)),sg=n<0?'-':'';
  // 만 단위로 표시(억/백만 안 씀). 예: 10,000,000→"1,000만", 12,500,000→"1,250만", 50,000→"5만"
  if(a>=10000)return sg+Math.round(a/10000).toLocaleString('ko-KR')+'만';
  return sg+a.toLocaleString('ko-KR');
}
function todayStr(){
  const d=new Date();   // 등록 시점의 실제 날짜(자정 넘겨 열어둬도 정확)
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

          <div class="form-actions"><button class="btn-cancel" onclick="clearImport()">취소</button><button class="btn-save" onclick="commitImport()">선택 항목 등록</button></div>

    // 새 지출 추가 폼은 리스트 맨 위, 수정 폼은 해당 항목 자리에 인라인으로 표시한다.

      const sortedCur=[...curList].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
      // 날짜별 그룹(내림차순 유지)

      h+=`<div class="expense-list">`;
      order.forEach(d=>{
        const items=groups[d];
        const dtotal=items.reduce((s,e)=>s+(Number(e.amt)||0),0);
        const wdIdx=(()=>{const p=parseYmd(d);return p?new Date(p.y,p.m,p.d).getDay():-1;})();
        const wdCls=wdIdx===0?'sun':wdIdx===6?'sat':'';
        h+=`<div class="day-head" data-date="${esc(d)}"><span class="dh-day ${wdCls}">${esc(dayLabel(d))}</span><span class="dh-sum">${dtotal<0?'+':'-'}${fmt(dtotal)}</span></div>`;
        items.forEach(e=>{
          if(S.showForm && S.editId===e.id){h+=expFormHtml(e,true);return;}

            </div>

              <button class="icon-btn star" onclick="starExp('${e.id}')">⭐ 자주</button>

  if(S.view==='cat'){

      ${cats.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border);font-size:13px">
        <span>${esc(c)}</span>
        <button onclick="delCat(${esc(JSON.stringify(c))})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:0 4px;line-height:1">×</button>
      </div>`).join('')}
      <div style="padding:10px 13px;display:flex;gap:6px">
        <input id="newCatDirect" type="text" placeholder="새 항목명 입력" style="flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none">
        <button onclick="addCatDirect()" style="padding:7px 14px;background:var(--accent);color:var(--bg);border:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">추가</button>
      </div>
    </div>`;
  }

  if(S.view==='fixed'){
    const fi=getFixedForMonth(S.month),si=getSavForMonth(S.month);
    const byT={권능:[],가영:[],공통:[]};
    fi.forEach(it=>{if(byT[it.tag])byT[it.tag].push(it);});
    h+=`<div class="save-bar"><span class="save-hint">${MONTHS[S.month]} 금액 · 항목은 모든 달 공통</span><button class="btn-fixed-save" onclick="saveFixed()">저장</button></div>`;
    ['권능','가영','공통'].forEach(tag=>{

      h+=`<div class="fixed-box"><div class="fixed-header"><span>${tag} 고정지출</span><span>${fmt(sub)}</span></div>`;

        h+=`<div class="fixed-item">

        </div>`;

      h+=`<div style="padding:9px 13px;display:flex;gap:6px;border-top:1px solid var(--border)">

        <input type="number" inputmode="numeric" placeholder="금액" id="newFA_${tag}" style="width:90px;padding:7px 9px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;text-align:right">
        <button onclick="addFixed('${tag}')" style="padding:7px 11px;background:var(--accent);color:var(--bg);border:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0">+</button>
      </div></div>`;
    });
    const savSub=si.reduce((s,i)=>s+(Number(i.amt)||0),0);
    h+=`<div class="fixed-box"><div class="fixed-header"><span class="saving-label">💚 저축 / 투자</span><span class="saving-label">${fmt(savSub)}</span></div>`;

      h+=`<div class="fixed-item">
        <input class="fixed-input" style="flex:1;width:auto" type="text" data-sname="${it.id}" value="${esc(it.name)}" placeholder="항목명">

    // (수입/변동지출 항목이 있거나, 그 달 전용 고정·저축 금액을 저장한 적이 있는 달)
    const hasData=mm=>getIncArr(mm).length>0||getExps(mm).length>0||liveData['fgm'+YY+'_'+mm]!=null||liveData['sgm'+YY+'_'+mm]!=null;
    const rows=[];
    for(let mm=0;mm<12;mm++){
      const inc=getIncArr(mm).reduce((s,i)=>s+(Number(i.amt)||0),0);
      const fx=ft(mm),sv=st(mm),vr=getExps(mm).reduce((s,e)=>s+(Number(e.amt)||0),0);
      rows.push({m:mm,inc,fx,sv,vr,exp:fx+sv+vr,bal:inc-(fx+sv+vr),active:hasData(mm)});
    }
    const shown=rows.filter(r=>r.active);
    let yInc=0,yFx=0,ySv=0,yVr=0;
    shown.forEach(r=>{yInc+=r.inc;yFx+=r.fx;ySv+=r.sv;yVr+=r.vr;});
    const yExp=yFx+ySv+yVr,yBal=yInc-yExp;
    const maxExp=Math.max(1,...shown.map(r=>r.exp));
    h+=`<div class="cards">
      <div class="card"><div class="card-label">${YEAR} 수입</div><div class="card-val">${fmtS(yInc)}</div><div class="card-sub">${fmt(yInc)}</div></div>
      <div class="card"><div class="card-label">${YEAR} 지출</div><div class="card-val">${fmtS(yExp)}</div><div class="card-sub">고정 ${fmtS(yFx)}·저축 ${fmtS(ySv)}·변동 ${fmtS(yVr)}</div></div>
      <div class="card ${yBal>=0?'green':'red'}"><div class="card-label">연간 잔액</div><div class="card-val">${fmtS(yBal)}</div><div class="card-sub">${yInc>0?'저축률 '+(ySv/yInc*100).toFixed(1)+'%':'수입 입력 필요'}</div></div>
      <div class="card"><div class="card-label">월평균 변동지출</div><div class="card-val">${fmtS(shown.length?yVr/shown.length:0)}</div><div class="card-sub">${shown.length}개월 기준</div></div>
    </div>`;
    if(!shown.length){
      h+=`<div class="empty"><div class="empty-icon">📅</div>아직 기록된 달이 없어요</div>`;
    }else{
      h+=`<div class="sec-title"><span>월별 비교 (총지출)</span><span class="cat-pct">▲▼는 지난달 대비 · 탭하면 이동</span></div><div class="yr-list">`;
      shown.forEach((r,idx)=>{
        const prev=idx>0?shown[idx-1]:null;
        let delta='';
        if(prev){const d=r.exp-prev.exp;if(d!==0)delta=`<span class="yr-delta" style="color:${d>0?'var(--red)':'var(--green)'}">${d>0?'▲':'▼'}${fmtS(Math.abs(d))}</span>`;}
        h+=`<div class="yr-row ${r.m===S.month?'cur':''}" onclick="goMonth(${r.m})">
          <div class="yr-top"><span class="yr-mon">${MONTHS[r.m]}</span><span>지출 <strong>${fmtS(r.exp)}</strong>${delta}</span></div>
          <div class="yr-bar-bg"><div class="yr-bar-fill" style="width:${Math.round(r.exp/maxExp*100)}%"></div></div>
          <div class="yr-nums" style="margin-top:4px">수입 ${fmtS(r.inc)} · 변동 ${fmtS(r.vr)} · 잔액 ${fmtS(r.bal)}</div>
        </div>`;
      });
      h+=`</div>`;
    }
  }

  const _sy=window.scrollY;
  document.getElementById('content').innerHTML=h;
  window.scrollTo(0,_sy);
}

function saveBatch(){

// 즐겨찾기 칩 바 HTML (kind: 'expense' | 'income')

function addFavFrom(kind,obj){
  const fav = kind==='income'

// 보는 연/월과 무관하게 "오늘(실제 현재 연·월)"로 화면 맥락을 맞춘다.
function goTodayCtx(){const d=new Date();YEAR=d.getFullYear();YY=String(YEAR).slice(-2);S.month=d.getMonth();}
// 즐겨찾기 원탭 등록 (항상 오늘 날짜·오늘 달). 금액 없는 즐겨찾기는 폼을 프리필해서 연다.
function useFav(id){
  const f=getFavs().find(x=>x.id===id);if(!f)return;
  goTodayCtx();
  if(!(Number(f.amt)>0)){
    if(f.kind==='income'){S.prefill={type:f.type,name:f.name};S.showIncForm=true;S.incEditId=null;render();setTimeout(()=>{const el=document.getElementById('iAmt');if(el)el.focus({preventScroll:true});},80);}
    else{S.prefill={cat:f.cat,name:f.name,who:f.who};S.showForm=true;S.editId=null;render();setTimeout(()=>{const el=document.getElementById('fAmt');if(el)el.focus({preventScroll:true});},80);}
    return;
  }
  const date=todayStr();
  if(f.kind==='income'){
    const nit={id:genId('n'),date,type:f.type||'기타',name:f.name,amt:Number(f.amt)};
    applyInc(S.month,arr=>[...arr,nit].sort(dsort));
  }else{
    const nit={id:genId('x'),date,cat:f.cat,name:f.name,amt:Number(f.amt),who:f.who};
    applyExps(S.month,arr=>[...arr,nit].sort(dsort));

  render();toast(`${f.name||f.cat||f.type} 오늘 등록됨`);

// 지난달 지출을 이번 달로 통째 복사 (금액·항목 그대로, 날짜만 이번 달로)
function copyPrevMonth(){
  const m=S.month;
  if(m<=0){alert('1월은 지난달이 없어요');return;}
  const prev=getExps(m-1);
  if(!prev.length){alert('지난달 지출 내역이 없어요');return;}
  if(!confirm(`${MONTHS[m-1]} 지출 ${prev.length}건을 ${MONTHS[m]}로 복사할까요?\n(금액·항목은 그대로, 날짜만 ${MONTHS[m]}로 맞춰요)`))return;
  const lastDay=new Date(YEAR,m+1,0).getDate();
  const copies=prev.map(e=>{
    const p=parseYmd(e.date),day=p?Math.min(p.d,lastDay):1;
    const date=`${YEAR}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    return {id:genId('x'),date,cat:e.cat,name:e.name,amt:Number(e.amt)||0,who:e.who};
  });
  applyExps(m,arr=>[...arr,...copies].sort(dsort));render();
  alert(`${copies.length}건 복사했어요.`);
}
// 검색·항목 필터: DOM에서 직접 표시/숨김 (화면 재생성 없음 → 한글 입력 안전)
// 'YYYY-MM-DD' → 'N일 요일'
function dayLabel(d){
  const p=parseYmd(d);
  if(!p)return d||'날짜 미상';

// 'YYYY-MM-DD'를 파싱하고 실제 존재하는 날짜인지 검증. {y,m(0-based),d} 또는 null.
function parseYmd(s){
  const mm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
  if(!mm)return null;
  const y=+mm[1],mo=+mm[2],d=+mm[3];
  const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return {y,m:mo-1,d};
}

// ── 공통 파싱 유틸 ────────────────────────────────────────────
function fixDigits(s){return String(s).replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/[^\d]/g,'');}
// 한 줄에서 원화 금액을 추출 {sign:'+'|'-', amt, raw}. 없으면 null.
function lineAmount(line){
  const m=String(line).match(/([+-]?)\s*([0-9OIl][0-9OIl,.\s]{0,13})\s*[원웜뭔윈]/);
  if(!m)return null;
  const v=Number(fixDigits(m[2]));
  if(!v||v<10)return null;
  return {sign:m[1]||'',amt:v,raw:m[0]}; // '-'|'+'|''(부호없음, 잔액 등)
}
// 여러 날짜 표기를 {y,m,d}로. 연/월 없으면 fallback 사용.
function parseAnyDate(s,fy){
  s=String(s||'');
  let mm=s.match(/(20\d{2})\s*[.\-\/년]\s*(1[0-2]|0?[1-9])\s*[.\-\/월]\s*(3[01]|[12]\d|0?[1-9])\s*일?/);
  if(mm)return{y:+mm[1],m:+mm[2],d:+mm[3]};
  mm=s.match(/(?:^|[^\d])(1[0-2]|0?[1-9])\s*[.\-\/월]\s*(3[01]|[12]\d|0?[1-9])\s*일?(?![\d:])/);
  if(mm)return{y:fy,m:+mm[1],d:+mm[2]};
  return null;
}
// {y,m,d}를 검증해 'YYYY-MM-DD'로. 유효하지 않으면 null.
function mkDate(y,m,d){
  if(!y||!m||!d)return null;
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function mkItem(date,name,amt,kind){
  const nm=(String(name||'').replace(/[|]/g,' ').replace(/\s+/g,' ').trim()||'내용 미인식').slice(0,60);
  const soft=/송금/.test(nm)&&/→/.test(nm); // 개인 송금은 지출인지 애매 → 기본 체크 해제
  return {date,name:nm,amt:Math.abs(Math.round(amt)),cat:importCategory(nm),
    kind:kind||'expense',who:(S.person==='전체'?'권능':S.person),type:'기타',selected:!soft};
}
function cleanImportName(block){
  const junk=/(잔액|체크카드|신용카드|승인번호|출금계좌|입금계좌|오전|오후|\d{1,2}:\d{2})/i;
  const line=block.map(s=>s.trim()).find(s=>s&&!junk.test(s)&&!/^[-+]?\s*[\d,.]+\s*원?$/.test(s));
  return (line||block[0]||'내용 미인식').replace(/[|]/g,' ').trim().slice(0,60);
}
function isCancelled(t){return /결제\s*취소|승인\s*취소|취소\s*완료|거래\s*취소/.test(t);}
function isNonExpense(t){return /충전|카드\s*(대금|값|결제대금)|결제\s*대금|내\s*계좌\s*이체|저축.*이체|1원\s*송금/.test(t);}
function isJunkLine(t){return !t||/^(이벤트|결제|취소|포인트|전체|충전|사용|내역|카드만들기|페이머니|pay|잔액|승인번호|출금계좌|입금계좌|머니)$/i.test(t)||/머니\s*\+?\s*포인트/.test(t)||/^\d{4}\s*[.\-]/.test(t)||/오[전후]\s*\d/.test(t)||/^\d{1,2}:\d{2}/.test(t)||/^\d{1,2}\s*월(\s*[·・].*)?$/.test(t)||/^\d{1,2}일\s*(월|화|수|목|금|토|일)요일/.test(t);}
// 스크린샷/텍스트 → 거래 배열. 소스(토스/카카오/삼성) 자동 판별.
function parseTransactions(raw,defaultMonth){
  const lines=String(raw||'').replace(/\r/g,'').split('\n').map(s=>s.replace(/[​ ]/g,' ').trim()).filter(Boolean);
  const all=lines.join(' ');
  if(/머니\s*\+?\s*포인트\s*결제|이벤트\s*결제|결제\s*취소/.test(all)&&/20\d{2}\s*[.\-]/.test(all))return parseSamsung(lines);
  // 카드앱(뱅크샐러드 등): "가맹점 | 카드" 줄 + "N일 요일" 헤더. 금액 위·이름 아래 구조라 전용 파서.
  if(/(동백전\s*체크카드|BC\s*바로\s*ZONE\s*카드|현대카드\s*ZERO|토스뱅크\s*체크카드|쿠팡\s*와우\s*카드|K-?패스\(신용\))/.test(all)&&/\d{1,2}\s*일\s*(월|화|수|목|금|토|일)요일/.test(all))return parseCardApp(lines,defaultMonth);
  // 카카오페이 전용 마커(페이머니)가 있을 때만 카카오 파서.
  if(/카카오페이머니|[·・]\s*페이머니/.test(all))return parseKakao(lines,defaultMonth);
  return parseImportText(raw,defaultMonth);
}
// 카드앱(뱅크샐러드 등): 로고글자→금액→"가맹점 | 카드" 순. "가맹점|카드" 줄을 앵커로 삼고
// 그 위에서 금액을 찾는다(로고·설명 줄은 건너뜀). 취소·해외캐시백은 제외.
function cardMerchant(line){
  let s=String(line).split('|')[0];
  s=s.replace(/\s*(부산\s*동백전\s*체크카드.*|동백전\s*체크카드.*|BC\s*바로\s*ZONE\s*카드.*|현대카드\S*.*|토스뱅크\s*체크카드.*|K-?패스\S*.*|\(신\)\s*쿠팡\s*와우\s*카드.*|쿠팡\s*와우\s*카드.*|와우\s*카드.*|체크카드.*|신용카드.*)$/,'');
  return s.replace(/\s+/g,' ').trim();
}
function isCardNameLine(l){return /(동백전|체크카드|BC\s*바로\s*ZONE|현대카드|토스뱅크\s*체크|쿠팡\s*와우\s*카드|와우\s*카드|K-?패스\(신용\))/.test(l)&&/[가-힣A-Za-z]/.test(l);}
function parseCardApp(lines,defaultMonth){
  const out=[];let skipped=0,month=defaultMonth+1,day=null;
  for(const l of lines){const m=l.match(/(?:^|\s)(1[0-2]|[1-9])\s*월(?:\s|$|[▶>▷▸)])/);if(m){month=Number(m[1]);break;}}
  for(let i=0;i<lines.length;i++){
    const dh=lines[i].match(/^(\d{1,2})\s*일\s*(월|화|수|목|금|토|일)요일/);
    if(dh){day=Number(dh[1]);continue;}
    if(!isCardNameLine(lines[i]))continue;
    if(/취소/.test(lines[i])){skipped++;continue;}
    let amt=0;
    for(let j=i-1;j>=0&&j>=i-4;j--){
      if(/^(\d{1,2})\s*일\s*(월|화|수|목|금|토|일)요일/.test(lines[j]))break;
      if(isCardNameLine(lines[j]))break;
      const a=lineAmount(lines[j]);if(a){amt=a.amt;break;}
      // '원' 없는 금액(해외결제 등: "-33,835") 대비: 가장 가까운 콤마 숫자(1,000+)
      const b=lines[j].match(/(?:^|[^\d])(\d{1,3}(?:,\d{3})+)(?!\d)/);if(b){amt=Number(b[1].replace(/,/g,''));break;}
    }
    const name=cardMerchant(lines[i]);
    if(!amt||!day||!name){skipped++;continue;}
    const date=mkDate(YEAR,month,day);
    if(!date){skipped++;continue;}
    out.push(mkItem(date,name,amt,'expense'));
  }
  return {items:out,skipped};
}
// 삼성월렛/삼성페이: [가맹점] -금액원 / YYYY.M.D. 오후 h:mm:ss / 이벤트 결제 / 머니+포인트 결제
function parseSamsung(lines){
  const out=[];let skipped=0;
  const amtIdx=[];lines.forEach((l,i)=>{const a=lineAmount(l);if(a&&a.sign==='-')amtIdx.push(i);});
  for(let k=0;k<amtIdx.length;k++){
    const i=amtIdx[k],a=lineAmount(lines[i]);
    const winEnd=Math.min(k+1<amtIdx.length?amtIdx[k+1]-1:lines.length-1,i+4);
    const meta=lines.slice(i+1,winEnd+1);
    let name=lines[i].replace(a.raw,'').trim();
    if(!/[가-힣A-Za-z]/.test(name)){for(let j=i-1;j>=(k>0?amtIdx[k-1]+1:0);j--){if(!isJunkLine(lines[j])){name=lines[j];break;}}}
    const around=meta.join(' ')+' '+lines[i];
    if(isCancelled(around)||isNonExpense(around)){skipped++;continue;}
    let dt=null;for(const ml of meta){dt=parseAnyDate(ml,YEAR);if(dt)break;}
    const date=dt?mkDate(dt.y,dt.m,dt.d):null;
    if(!date){skipped++;continue;}
    out.push(mkItem(date,name,a.amt,'expense'));
  }
  return {items:out,skipped};
}
// 카카오페이: "8월 · 페이머니" 월 헤더, "22일 토요일 -합계" 일자 헤더, 가맹점/금액 순.
function parseKakao(lines,defaultMonth){
  const out=[];let skipped=0,month=defaultMonth+1,day=null;
  const monH=lines.find(l=>/(\d{1,2})월\s*[·・]/.test(l));if(monH)month=Number(monH.match(/(\d{1,2})월/)[1]);
  for(let i=0;i<lines.length;i++){
    const dh=lines[i].match(/^(\d{1,2})일\s*(월|화|수|목|금|토|일)요일/);
    if(dh){day=Number(dh[1]);continue;} // 일자 헤더의 합계 금액은 거래로 잡지 않음
    const mh=lines[i].match(/^(\d{1,2})월(\s|$|[·・])/);if(mh){month=Number(mh[1]);continue;}
    const a=lineAmount(lines[i]);if(!a)continue;
    let name=lines[i].replace(a.raw,'').trim();
    if(!/[가-힣A-Za-z]/.test(name)){for(let j=i-1;j>=0;j--){if(/^(\d{1,2})일\s*(월|화|수|목|금|토|일)요일/.test(lines[j]))break;if(!isJunkLine(lines[j])){name=lines[j];break;}}}
    if(isNonExpense(name)||isCancelled(name)){skipped++;continue;}
    const date=mkDate(YEAR,month,day);
    if(!date){skipped++;continue;}
    out.push(mkItem(date,name,a.amt,a.sign==='+'?'income':'expense'));
  }
  return {items:out,skipped};
}
function parseImportText(raw,defaultMonth){
  const lines=String(raw||'').replace(/\r/g,'').split('\n').map(s=>s.replace(/[\u200b\u00a0]/g,' ').trim()).filter(Boolean);
  let month=defaultMonth+1,day=null,start=0,skipped=0;const out=[];
  const defWho=(S.person==='전체'?'권능':S.person);
  const amountRe=/([+-]?)\s*([0-9OIl][0-9OIl,.\s]{1,14})\s*[원웜뭔윈]?\s*$/i;
  for(let i=0;i<lines.length;i++){
    // 날짜 헤더: 금액이 없는 줄에서만 월/일 추출(한 줄에 둘 다 있어도 모두 반영).
    // "8월 정기결제 -9,900원"처럼 금액이 있는 줄은 헤더로 오인하지 않음.
    if(!amountRe.test(lines[i])){
      const mon=lines[i].match(/(?:^|\s)(1[0-2]|0?[1-9])\s*월/);
      const dm=lines[i].match(/(?:^|\s)(3[01]|[12]?\d)\s*일/);
      if(mon||dm){if(mon)month=Number(mon[1]);if(dm)day=Number(dm[1]);start=i+1;continue;}
    }
    const am=lines[i].match(amountRe);if(!am)continue;
    const digits=am[2].replace(/[Oo]/g,'0').replace(/[Il]/g,'1').replace(/[^0-9]/g,'');
    const amt=Number(digits);if(!amt||amt<10)continue;
    // 이름: 금액과 같은 줄에서 금액 부분을 떼어 우선 사용(가맹점 … 금액 레이아웃). 없으면 이전 줄에서.
    const sameLine=lines[i].replace(am[0],'').trim();
    const block=lines.slice(start,i);start=i+1;
    const joined=(block.join(' ')+' '+sameLine).trim();
    const financeOnly=/→/.test(joined)&&joined.split('→').every(x=>/(내\s*|은행|뱅크|카드|페이|머니|통장|계좌)/i.test(x));
    if(!day||IMPORT_EXCLUDES.some(re=>re.test(joined))||financeOnly){skipped++;continue;}
    const kind=(am[1]==='+'||(/→\s*내\s*/.test(joined)&&!/내\s*.*→/.test(joined)))?'income':'expense';
    // 이름: ①금액과 같은 줄 ②금액 앞 줄(block) ③금액 다음 줄(카드앱: 금액 위·이름 아래). "가맹점 | 카드" 는 앞부분만.
    let name='';
    if(/[가-힣A-Za-z]/.test(sameLine)) name=sameLine;
    else{
      const b=cleanImportName(block);
      if(b&&b!=='내용 미인식'&&/[가-힣A-Za-z]/.test(b)) name=b;
      else for(let k=i+1;k<lines.length&&k<=i+3;k++){
        if(amountRe.test(lines[k]))break;                                   // 다음 거래 금액
        if(/(?:^|\s)(1[0-2]|0?[1-9])\s*월|(?:^|\s)(3[01]|[12]?\d)\s*일/.test(lines[k]))break; // 날짜헤더
        const cand=lines[k].split('|')[0].trim();
        if(/[가-힣A-Za-z]/.test(cand)&&!isJunkLine(cand)){name=cand;start=k+1;break;}
      }
    }
    name=name.split('|')[0].replace(/[|]/g,' ').trim().slice(0,60)||'내용 미인식';
    const validDate=new Date(YEAR,month-1,day);
    if(validDate.getMonth()!==month-1||validDate.getDate()!==day){skipped++;continue;}
    const date=`${YEAR}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    out.push({date,name,amt,cat:importCategory(name),kind,who:defWho,type:'기타',selected:true});
  }
  return {items:out,skipped};
}
// ── 엑셀/CSV 파싱(페이북 등) ──────────────────────────────────
const XL_DATE=/일자|날짜|거래일|이용일|승인일|거래일시|이용일시|결제일|사용일/;
const XL_NAME=/가맹점|이용하신곳|이용내역|거래내용|적요|사용처|상호|내용|가맹점명/;
const XL_AMT=/금액|이용금액|승인금액|거래금액|결제금액|사용금액|출금|이용대금|청구금액/;
const XL_TYPE=/구분|유형|입출금|취소|거래구분/;
function parseExcelRows(rows){
  const out=[];let skipped=0;
  let hi=-1;
  for(let r=0;r<Math.min(rows.length,12);r++){
    const cells=(rows[r]||[]).map(c=>String(c==null?'':c));
    if(cells.some(c=>XL_DATE.test(c))&&cells.some(c=>XL_AMT.test(c))){hi=r;break;}
  }
  if(hi<0)return{items:[],skipped:0,noHeader:true};
  const hdr=(rows[hi]||[]).map(c=>String(c==null?'':c));
  const find=re=>{let idx=-1;hdr.forEach((c,ci)=>{if(idx<0&&re.test(c))idx=ci;});return idx;};
  const dC=find(XL_DATE),nC=find(XL_NAME),aC=find(XL_AMT),tC=find(XL_TYPE);
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]||[];
    const rawD=String(row[dC]==null?'':row[dC]);
    const rawA=String(row[aC]==null?'':row[aC]);
    const nm=nC>=0?String(row[nC]==null?'':row[nC]):'';
    const tp=tC>=0?String(row[tC]==null?'':row[tC]):'';
    if(!rawD.trim()&&!rawA.trim())continue;
    const dt=parseAnyDate(rawD,YEAR);const date=dt?mkDate(dt.y,dt.m,dt.d):null;
    const neg=/^\s*[-(]/.test(rawA);
    const amt=Number(fixDigits(rawA));
    if(!date||!amt){skipped++;continue;}
    if(isCancelled(nm+' '+tp)||isNonExpense(nm+' '+tp)||/취소|환불|환급/.test(nm+' '+tp)){skipped++;continue;}
    const kind=neg?'income':'expense';
    out.push(mkItem(date,nm,amt,kind));
  }
  return {items:out,skipped};
}

// DB 준비 전/오프라인 대비 localStorage에도 캐시.

// 구글 비전 무료 한도(월 1,000장) 사용량 추적 — 매월 자동 리셋
const VISION_FREE=1000;
function _vmonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function visionUsage(){let u={month:_vmonth(),count:0};try{const s=JSON.parse(localStorage.getItem('gagebu_vision_usage')||'null');if(s&&s.month===_vmonth())u=s;}catch(_){}return u;}
function bumpVisionUsage(n){const u=visionUsage();u.count+=(n||1);try{localStorage.setItem('gagebu_vision_usage',JSON.stringify(u));}catch(_){}return u;}
function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(file);});}
// 같은 이미지 재인식 방지 캐시: 이미지 해시→인식결과. 재읽기 시 구글 재호출·사용량 차감 안 함.
async function imgHash(file){
  try{const buf=await file.arrayBuffer();const h=await crypto.subtle.digest('SHA-256',buf);
    return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
  }catch(_){try{return 'f'+file.size+'_'+(file.lastModified||0);}catch(__){return null;}}
}
function visionCacheGet(hash){try{return JSON.parse(localStorage.getItem('gagebu_vision_cache')||'{}')[hash];}catch(_){return null;}}
function visionCacheSet(hash,text){try{
  let c={};try{c=JSON.parse(localStorage.getItem('gagebu_vision_cache')||'{}');}catch(_){}
  c[hash]=text;const ks=Object.keys(c);while(ks.length>80){delete c[ks.shift()];} // 최근 80장 유지
  localStorage.setItem('gagebu_vision_cache',JSON.stringify(c));
}catch(_){}}
async function visionOCR(file,key){
  const content=await fileToBase64(file);
  const body={requests:[{image:{content},features:[{type:'DOCUMENT_TEXT_DETECTION'}],imageContext:{languageHints:['ko','en']}}]};
  const url='https://vision.googleapis.com/v1/images:annotate?key='+encodeURIComponent(key);
  const transient=m=>/unavailable|internal|try again|deadline|timeout|일시|잠시/i.test(m||'');
  let lastErr=null;
  for(let attempt=0;attempt<4;attempt++){
    if(attempt) await new Promise(r=>setTimeout(r,600*attempt)); // 0.6s,1.2s,1.8s 대기 후 재시도
    try{
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      let j={};try{j=await res.json();}catch(_){}
      if(res.status===503||res.status===429||res.status===500){lastErr=new Error((j&&j.error&&j.error.message)||('HTTP '+res.status));continue;}
      if(!res.ok)throw new Error((j&&j.error&&j.error.message)||('HTTP '+res.status));
      const r0=(j.responses&&j.responses[0])||{};
      if(r0.error&&r0.error.message){ if(transient(r0.error.message)){lastErr=new Error(r0.error.message);continue;} throw new Error(r0.error.message); }
      return (r0.fullTextAnnotation&&r0.fullTextAnnotation.text)||'';
    }catch(e){ lastErr=e; if(!transient(e.message)&&!/network|fetch|load failed/i.test(e.message||''))throw e; }
  }
  throw new Error('구글 서버가 잠시 불안정해요. 잠깐 뒤 다시 시도해주세요. ('+((lastErr&&lastErr.message)||'unavailable')+')');
}
// ── OCR 품질 개선: 이미지 전처리 + 정밀 한글모델 워커(1회 생성·재사용) ──
let _ocrWorker=null, _ocrProgress=null;
function _setImportStatus(t){S.importStatus=t;const el=document.querySelector('.import-status');if(el)el.textContent=t;}
// 정밀(best) 한글 모델 워커. 실패 시 기본(fast) 모델로 폴백. PSM 6·단어간격 보존.
async function getOcrWorker(){
  if(_ocrWorker) return _ocrWorker;
  const mk=async(opts)=>{
    const w=await Tesseract.createWorker('kor+eng',1,Object.assign({
      logger:p=>{if(p.status==='recognizing text'&&_ocrProgress)_ocrProgress(p.progress||0);}
    },opts));
    await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
    return w;
  };
  try{ _ocrWorker=await mk({langPath:'https://tessdata.projectnaptha.com/4.0.0_best'}); }
  catch(e){ console.warn('정밀 한글모델 로드 실패 → 기본 모델 사용',e); _ocrWorker=await mk({}); }
  return _ocrWorker;
}
// 스크린샷 전처리: 확대(작을 때)·흑백·다크모드 자동반전·대비강화 → 한글 인식률 향상
function preprocessForOCR(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      try{
        const minW=1800, scale=(img.width>0&&img.width<minW)?Math.min(3,minW/img.width):1;
        const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,0,0,w,h);
        const im=ctx.getImageData(0,0,w,h),d=im.data;
        let sum=0;
        for(let i=0;i<d.length;i+=4){const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];d[i]=d[i+1]=d[i+2]=g;sum+=g;}
        const dark=(sum/(d.length/4))<115;           // 평균 밝기로 다크모드 추정
        const contrast=1.4;
        for(let i=0;i<d.length;i+=4){
          let g=d[i]; if(dark)g=255-g;               // 다크모드면 반전(검은 글씨·흰 배경)
          g=(g-128)*contrast+128; g=g<0?0:g>255?255:g;
          d[i]=d[i+1]=d[i+2]=g;
        }
        ctx.putImageData(im,0,0);URL.revokeObjectURL(url);
        c.toBlob(b=>resolve(b||file),'image/png');
      }catch(err){URL.revokeObjectURL(url);reject(err);}
    };
    img.onerror=e=>{URL.revokeObjectURL(url);reject(e);};
    img.src=url;
  });
}
async function readImportFiles(fileList){
  const files=[...(fileList||[])].filter(f=>f&&f.type.startsWith('image/'));
  if(!files.length){S.importStatus='이미지 파일을 찾지 못했어요.';render();return;}

  // 구글 비전 무료 한도 경고: 이번 배치로 월 1,000장을 넘게 되면 넣기 전에 확인

    const u=visionUsage(), willBe=u.count+files.length;
    if(willBe>VISION_FREE){
      const ok=confirm(`⚠️ 이번 달 구글 비전 무료 1,000장을 넘게 됩니다.\n\n현재 ${u.count}장 사용 · 이번 ${files.length}장 추가 → ${willBe}장\n1,000장 초과분은 구글에서 소액 과금될 수 있어요.\n\n계속할까요?`);

  S.importStatus=vkey?`${files.length}장 구글 비전으로 읽는 중…`:`${files.length}장 준비 중… (첫 인식은 한글모델 다운로드로 조금 걸려요)`;render();
  try{
    let worker=null;
    if(!vkey){ try{ worker=await getOcrWorker(); }catch(e){ console.warn('OCR 워커 생성 실패 → 1회성 인식으로 대체',e); } }
    for(let i=0;i<files.length;i++){
      _setImportStatus(`${i+1}/${files.length}장 읽는 중…`);
      let text='';

        const cached=hash?visionCacheGet(hash):null;
        if(cached!=null){ text=cached; _setImportStatus(`${i+1}/${files.length}장 (이미 읽은 이미지 → 재사용, 사용량 미차감)`); }
        else{

        if(worker){
          _ocrProgress=fr=>_setImportStatus(`${i+1}/${files.length}장 글자 읽는 중 · ${Math.round(fr*100)}%`);

            if(p.status==='recognizing text')_setImportStatus(`${i+1}/${files.length}장 글자 읽는 중 · ${Math.round((p.progress||0)*100)}%`);
          }});
          text=result?.data?.text||'';
        }
      }
      S.importRaw+=(S.importRaw?`\n----- ${i+1}장 -----\n`:'')+text;
      const parsed=parseTransactions(text,S.month);
      S.importItems.push(...parsed.items);S.importSkipped+=parsed.skipped;
    }

    S.importStatus=(S.importItems.length

      :'등록할 거래를 찾지 못했어요. 아래 "인식 원문 보기"를 확인해주세요.')+near;
  }catch(e){console.error(e);S.importStatus='스크린샷을 읽지 못했어요. 잠시 후 다시 시도해주세요.';}
  S.importBusy=false;render();
}
function commitImport(){

      const who=it.who||(S.person==='전체'?'권능':S.person);
      const dupe=getExps(m).some(x=>x.date===it.date&&Number(x.amt)===it.amt&&(x.name||'')===it.name&&x.who===who);
      if(dupe){dupes++;return;}
      const nit={id:genId('x'),date:it.date,cat:it.cat,name:it.name,amt:it.amt,who};
      applyExps(m,arr=>[...arr.filter(x=>x.id!==nit.id),nit].sort(dsort));
    }
    added++;
  });
  clearImport();alert(`${added}건 등록했어요.${dupes?`\n이미 등록된 ${dupes}건은 건너뛰었어요.`:''}`);
}
function saveExp(){
  const date=document.getElementById('fDate')?.value||defaultDate();
  const cat=document.getElementById('fCat')?.value||getCats()[0];
  const name=(document.getElementById('fName')?.value||'').trim();
  const amtV=document.getElementById('fAmt')?.value||'';
  const amt=Number(amtV);
  if(!amtV.trim()||!Number.isFinite(amt)||amt===0){alert('금액을 입력해주세요');return;}
  const who=document.getElementById('fWho')?.value||(S.person==='전체'?'권능':S.person);
  const p=parseYmd(date);
  if(!p){alert('날짜가 올바르지 않아요');return;}
  if(p.y!==YEAR){alert(`지금은 ${YEAR}년 가계부예요.\n${p.y}년 내역은 상단에서 ${p.y}년을 먼저 선택한 뒤 입력해주세요.`);return;}
  const tm=p.m;
  if(S.editId!=null){
    const id=S.editId;
    if(tm===S.month){
      applyExps(S.month,arr=>arr.map(x=>x.id===id?{...x,date,cat,name,amt,who}:x).sort(dsort));
    }else{
      // 이동: 새 달에 먼저 추가하고 → 옛 달에서 삭제 (중간 실패 시 유실 대신 복구 가능한 중복)
      applyExps(tm,arr=>[...arr.filter(x=>x.id!==id),{id,date,cat,name,amt,who}].sort(dsort));
      applyExps(S.month,arr=>arr.filter(x=>x.id!==id));
    }
  }else{
    const id=genId('x');
    applyExps(tm,arr=>[...arr.filter(x=>x.id!==id),{id,date,cat,name,amt,who}].sort(dsort));
  }
  S.month=tm;S.showForm=false;S.editId=null;S.prefill=null;render();
}
function delExp(id){
  if(!confirm('삭제할까요?'))return;
  applyExps(S.month,arr=>arr.filter(x=>x.id!==id));render();
}
// 여러 개 선택 삭제
function toggleSelMode(){S.selMode=!S.selMode;S.selIds=[];S.showForm=false;S.showImport=false;S.batchRows=null;render();}
function toggleSel(id){const i=S.selIds.indexOf(id);if(i<0)S.selIds.push(id);else S.selIds.splice(i,1);render();}
function selAllCur(){
  const cur=(S.person==='전체')?getExps(S.month):getExps(S.month).filter(e=>e.who===S.person);
  const ids=cur.map(e=>e.id);
  S.selIds=(S.selIds.length===ids.length)?[]:ids; // 다시 누르면 전체 해제
  render();
}
function delSelected(){
  if(!S.selIds.length){alert('삭제할 항목을 선택해주세요');return;}
  if(!confirm(`선택한 ${S.selIds.length}건을 삭제할까요?`))return;
  const del=new Set(S.selIds);
  applyExps(S.month,arr=>arr.filter(x=>!del.has(x.id)));
  const n=S.selIds.length;S.selMode=false;S.selIds=[];render();toast(`${n}건 삭제했어요.`);
}
function previewFixed(){
  let fSum=0,sSum=0;
  document.querySelectorAll('[data-id]').forEach(el=>fSum+=Number(el.value)||0);
  document.querySelectorAll('[data-sid]').forEach(el=>sSum+=Number(el.value)||0);
  const fr=document.getElementById('ftRow'),sr=document.getElementById('stRow');
  if(fr)fr.innerHTML=`<span>총 고정지출</span><span>${fmt(fSum)}</span>`;
  if(sr)sr.innerHTML=`<span class="saving-label">저축 포함 합계</span><span class="saving-label">${fmt(fSum+sSum)}</span>`;
}
function saveFixed(){
  const m=S.month;
  // (1) 항목 이름은 공통 목록(fg/sg)에 저장 — 모든 달에 반영
  const fi=getFixedItems(),si=getSavItems();
  document.querySelectorAll('[data-name]').forEach(el=>{const it=fi.find(i=>i.id===el.dataset.name);if(it)it.name=el.value.trim()||it.name;});
  document.querySelectorAll('[data-sname]').forEach(el=>{const it=si.find(i=>i.id===el.dataset.sname);if(it)it.name=el.value.trim()||it.name;});
  fbSet('fg'+YY,fi);fbSet('sg'+YY,si);
  // (2) 금액은 이 달 전용 맵(fgm/sgm)에만 저장 — 다른 달에 영향 없음
  const fMap={},sMap={};
  document.querySelectorAll('[data-id]').forEach(el=>{fMap[el.dataset.id]=Number(el.value)||0;});
  document.querySelectorAll('[data-sid]').forEach(el=>{sMap[el.dataset.sid]=Number(el.value)||0;});
  fbSet('fgm'+YY+'_'+m,fMap);fbSet('sgm'+YY+'_'+m,sMap);
  alert('저장됐어요!');render();
}
function delFixed(id){if(!confirm('삭제할까요?'))return;fbSet('fg'+YY,getFixedItems().filter(i=>i.id!==id));render();}
function addFixed(tag){
  const n=(document.getElementById('newFN_'+tag)?.value||'').trim();
  const a=Number(document.getElementById('newFA_'+tag)?.value)||0;
  if(!n){alert('항목명을 입력해주세요');return;}
  const fi=getFixedItems();fi.push({id:genId('f'),name:n,amt:a,tag});
  fbSet('fg'+YY,fi);render();
}
function delSaving(id){if(!confirm('삭제할까요?'))return;fbSet('sg'+YY,getSavItems().filter(i=>i.id!==id));render();}
function addSaving(){
  const n=(document.getElementById('newSN')?.value||'').trim();
  const a=Number(document.getElementById('newSA')?.value)||0;
  if(!n){alert('항목명을 입력해주세요');return;}
  const si=getSavItems();si.push({id:genId('s'),name:n,amt:a});
  fbSet('sg'+YY,si);render();
}
function addCatDirect(){
  const inp=document.getElementById('newCatDirect');
  const name=(inp?.value||'').trim();
  if(!name)return;
  const cats=getCats();
  if(cats.includes(name)){alert('이미 있는 항목이에요');return;}
  cats.splice(cats.length-1,0,name);saveCats(cats);render();
}
function toggleAddCat(){
  S.addingCat=!S.addingCat;
  const row=document.getElementById('newCatRow');
  if(row){row.style.display=S.addingCat?'flex':'none';if(S.addingCat)setTimeout(()=>{const el=document.getElementById('newCatInput');if(el)el.focus();},50);}
}
function addCat(){
  const inp=document.getElementById('newCatInput');
  const name=(inp?.value||'').trim();
  if(!name)return;
  const cats=getCats();
  if(cats.includes(name)){alert('이미 있는 항목이에요');return;}
  cats.splice(cats.length-1,0,name);saveCats(cats);
  S.addingCat=false;
  const sel=document.getElementById('fCat');
  if(sel){const opt=document.createElement('option');opt.value=name;opt.text=name;opt.selected=true;sel.insertBefore(opt,sel.options[sel.options.length-1]);sel.value=name;}
  const row=document.getElementById('newCatRow');if(row)row.style.display='none';
}
function delCat(cat){
  if(cat==='기타'){alert("'기타'는 기본 분류라 삭제할 수 없어요");return;}
  // 이 연도 전체에서 이 항목을 쓰는 지출 건수 집계
  let used=0;
  for(let m=0;m<12;m++) used+=getExps(m).filter(e=>e.cat===cat).length;
  const msg=used>0
    ? `'${cat}' 항목을 삭제할까요?\n이 항목으로 기록된 지출 ${used}건은 '기타'로 옮겨져요.`
    : `'${cat}' 항목을 삭제할까요?`;
  if(!confirm(msg))return;
  // 기존 지출을 '기타'로 재분류(있는 달만, 트랜잭션으로 안전하게)
  for(let m=0;m<12;m++){
    if(getExps(m).some(e=>e.cat===cat))
      applyExps(m,arr=>arr.map(e=>e.cat===cat?{...e,cat:'기타'}:e));
  }
  // 목록에서 제거하고 '기타'는 항상 유지
  let cats=getCats().filter(c=>c!==cat);
  if(!cats.includes('기타')) cats.push('기타');
  saveCats(cats);render();
}

// ── 공유 코드 설정 ───────────────────────────────────────────
function setRoom(){
  const code=(document.getElementById('roomCodeInput').value||'').trim();
  if(code.length<3){alert('3자 이상 입력해주세요');return;}
  // Firebase 경로에 못 쓰는 문자(. # $ [ ] /)와 공백 차단 → 경로 변형/키 오류로 앱이 깨지는 것 방지
  if(!/^[A-Za-z0-9_-]{3,20}$/.test(code)){alert('영문·숫자·_·- 만 쓸 수 있어요 (3~20자)');return;}
  localStorage.setItem('gagebu_room',code);
  ROOM=code;
  document.getElementById('roomSetup').style.display='none';
  initFirebase();
  render();
}
function resetRoom(){
  if(!confirm('공유 코드를 초기화할까요?\n데이터는 그대로 유지돼요.'))return;
  localStorage.removeItem('gagebu_room');
  location.reload();
}

// ── 시작 ────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',function(){
  document.title='권능·가영 가계부';
  document.addEventListener('paste',e=>{
    const files=[...(e.clipboardData?.items||[])].filter(x=>x.kind==='file'&&x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);
    if(files.length){e.preventDefault();S.view='list';S.showImport=true;readImportFiles(files);}
  });
  document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault();});
  document.addEventListener('drop',e=>{
    const files=[...(e.dataTransfer?.files||[])].filter(x=>x.type.startsWith('image/'));
    if(files.length){e.preventDefault();S.view='list';S.showImport=true;readImportFiles(files);}
  });
  if(!ROOM){
    render();
    document.getElementById('roomSetup').style.display='flex';
  }else{
    initFirebase();
    render();
  }
});
</script>

    <p style="font-size:11px;color:var(--text3);text-align:center;margin-top:12px">가영이도 똑같은 코드 입력하면 돼요</p>
  </div>
</div>
