<div id="app">
  <div id="roomSetup">
    <div class="setup-box">
      <h2>공유 코드로 연결</h2>
      <p>가계부와 같은 공유 코드를 입력하면 두 앱이 같은 Firebase 공간을 사용합니다. 다른 코드를 쓰면 자산 데이터가 별도로 보관됩니다.</p>
      <div class="setup-rules"><b>코드 규칙</b><br>3~20자 · 영문, 숫자, 밑줄(_), 하이픈(-)만 사용</div>
      <input type="text" class="setup-input" id="roomCodeInput" placeholder="예: family_2026" maxlength="20" minlength="3" pattern="[A-Za-z0-9_-]{3,20}" autocomplete="off" aria-describedby="roomCodeHelp">
      <button class="setup-btn" onclick="setRoom()">이 코드로 시작</button>
      <p id="roomCodeHelp" style="font-size:11px;text-align:center;margin:11px 0 0">함께 쓰는 사람도 정확히 같은 코드를 입력해야 합니다.</p>
    </div>
  </div>
  <div id="mainApp" style="display:none">
    <header class="appbar">
      <div class="appbar-top">
        <div class="brand" id="viewTitle">자산관리<span class="brand-sub" id="viewSubtitle">통합 포트폴리오</span></div>
        <div class="appbar-tools">
          <button class="icon-btn" onclick="updatePrices(true)" aria-label="시세 업데이트">↻</button>
          <button class="icon-btn" onclick="setV('total')" aria-label="총자산 상세">⋯</button>
        </div>
      </div>
      <div class="sync-status"><span id="dot" class="sync-dot off"></span><span id="syncLabel">연결 확인 중</span><span id="lastUpdate">업데이트 대기</span></div>
    </header>
    <section class="portfolio-scope" id="portfolioScope" aria-label="포트폴리오 선택"></section>
    <main class="sec" id="content"></main>
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="nav-tab on" onclick="setV('dashboard')"><span class="nav-icon">⌂</span>현황</button>
      <button class="nav-tab" onclick="setV('holdings')"><span class="nav-icon">▦</span>보유자산</button>
      <button class="nav-tab" onclick="setV('history')"><span class="nav-icon">⌁</span>기록</button>
      <button class="nav-tab" onclick="setV('manage')"><span class="nav-icon">⚙</span>관리</button>
    </nav>
  </div>
  <div class="portfolio-backdrop" id="portfolioBackdrop" role="dialog" aria-modal="true" aria-labelledby="portfolioSheetTitle" onclick="if(event.target===this)closePortfolioManager()">
    <section class="portfolio-sheet"><div class="portfolio-sheet-head"><h2 id="portfolioSheetTitle">포트폴리오 관리</h2><button class="portfolio-sheet-close" onclick="closePortfolioManager()" aria-label="닫기">×</button></div><div id="portfolioSheetBody"></div></section>
  </div>
</div>

function safePortfolioId(value){const id=String(value||'');return /^[A-Za-z0-9_-]{1,40}$/.test(id)?id:null;}
function safePortfolioColor(value){const color=String(value||'');return /^#[0-9a-fA-F]{6}$/.test(color)?color:'#147a4b';}
function normalizePortfolios(rows){
  const source=Array.isArray(rows)?rows:[],seen=new Set(),normalized=[];
  source.forEach(row=>{
    const id=safePortfolioId(row?.id);if(!id||seen.has(id))return;seen.add(id);
    normalized.push({id,name:String(row?.name||'포트폴리오').slice(0,12),color:safePortfolioColor(row?.color),isDefault:id===DEFAULT_PORTFOLIO_ID});
  });
  if(!seen.has(DEFAULT_PORTFOLIO_ID))normalized.unshift({...DEFAULT_PORTFOLIO});
  return normalized;
}
function portfolios(){return normalizePortfolios(live.portfolios);}
function itemPortfolioId(item){
  const id=safePortfolioId(item?.portfolioId)||DEFAULT_PORTFOLIO_ID;
  return portfolios().some(p=>p.id===id)?id:DEFAULT_PORTFOLIO_ID;
}
function allAssets(){return {crypto:live.crypto||[],stocks:live.stocks||[],etf:live.etf||[],cash:live.cash||[]};}
function scopedAssets(){
  const filter=items=>S.portfolioId==='all'?(items||[]):(items||[]).filter(item=>itemPortfolioId(item)===S.portfolioId);
  return {crypto:filter(live.crypto),stocks:filter(live.stocks),etf:filter(live.etf),cash:filter(live.cash)};
}
function currentPortfolio(){return portfolios().find(p=>p.id===S.portfolioId)||null;}

function hydratePortfolioSelect(){

}

function fmtW(n){return Math.round(Math.abs(n)).toLocaleString('ko-KR')+'원';}
function fmtS(n){
  const a=Math.abs(Math.round(n)),sg=n<0?'-':'';
  if(a>=100000000)return sg+(a/100000000).toFixed(1)+'억';
  if(a>=10000)return sg+(a/10000).toFixed(0)+'만';
  return sg+a.toLocaleString('ko-KR');
}
function fmtWShort(n){
  const a=Math.abs(Math.round(n)),sg=n<0?'-':'';
  if(a>=100000000)return sg+(a/100000000).toFixed(2)+'억원';
  if(a>=10000)return sg+(a/10000).toFixed(0)+'만원';
  return sg+a.toLocaleString('ko-KR')+'원';
}
function escHtml(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function calcAssetVal(item, type){
  if(type==='crypto'){
    const p=prices[item.market];
    return p!=null ? item.qty*p : null;
  }else if(type==='stock'){
    if(item.manual) return null;
    const p=prices[item.ticker];
    if(p!=null){
      return isDomesticAsset(item) ? item.qty*p : (exRate!=null?item.qty*p*exRate:null);
    }
    return null;
  }else if(type==='etf'){
    if(item.manual) return null;
    const p=prices[item.ticker];
    if(p!=null){
      return isDomesticAsset(item) ? item.qty*p : (exRate!=null?item.qty*p*exRate:null);
    }
    return null;
  }
  return null;
}
function calcTotals(assets=scopedAssets()){
  let cryptoTotal=0,stockTotal=0,etfTotal=0,cashTotal=0,domesticTotal=0,foreignTotal=0;
  let hasCrypto=false,hasStock=false,hasEtf=false;
  assets.crypto.forEach(i=>{const v=calcAssetVal(i,'crypto');if(v!=null){cryptoTotal+=v;hasCrypto=true;}});
  assets.stocks.forEach(i=>{const v=calcAssetVal(i,'stock');if(v!=null){stockTotal+=v;hasStock=true;if(isDomesticAsset(i))domesticTotal+=v;else foreignTotal+=v;}});
  assets.etf.forEach(i=>{const v=calcAssetVal(i,'etf');if(v!=null){etfTotal+=v;hasEtf=true;if(isDomesticAsset(i))domesticTotal+=v;else foreignTotal+=v;}});
  assets.cash.forEach(i=>{cashTotal+=(Number(i.amount)||0);});
  const hasPrice=hasCrypto||hasStock||hasEtf;
  const total=cryptoTotal+stockTotal+etfTotal+cashTotal;
  // domestic/foreign은 stocks+etf를 통화(원화/외화) 기준으로 재분류한 파생값.
  // 기존 crypto/stocks/etf/cash 필드는 기록(history) 스키마 호환을 위해 그대로 둔다.
  return {crypto:cryptoTotal,stocks:stockTotal,etf:etfTotal,cash:cashTotal,domestic:domesticTotal,foreign:foreignTotal,total,hasPrice};
}
// 주식+ETF를 국내/해외(통화 기준)로 합쳐 보여주기 위한 헬퍼.
// item._kind로 원래 종류(stock/etf)를 기억해 calcAssetVal·시세 조회에 그대로 사용한다.
function investItems(stocksArr,etfArr){
  return [...(stocksArr||[]).map(i=>({...i,_kind:'stock'})),...(etfArr||[]).map(i=>({...i,_kind:'etf'}))];
}
function isDomesticAsset(item){
  if(item?.currency) return item.currency==='KRW';
  return /\.(KS|KQ)$/i.test(String(item?.ticker||''));
}
function needsExchangeRate(items){
  return (items||[]).some(i=>!isDomesticAsset(i));
}
function splitByCurrency(items){
  const domestic=items.filter(isDomesticAsset);
  const foreign=items.filter(i=>!isDomesticAsset(i));
  return {domestic,foreign};
}

function fetchWithTimeout(url, ms, options={}){
  return new Promise((resolve, reject)=>{
    const timer=setTimeout(()=>reject(new Error('timeout')), ms);
    fetch(url,options).then(r=>{clearTimeout(timer);resolve(r);},(e)=>{clearTimeout(timer);reject(e);});
  });
}

// Firebase/외부 API가 잠시 실패해도 직전에 정상 표시됐던 가격은 지우지 않는다.
// 숫자 시세만 복원해 메타데이터(source 등)가 prices에 섞이지 않게 한다.
function mergePriceCache(payload){
  if(!payload||typeof payload!=='object') return;
  Object.entries(payload).forEach(([key,value])=>{
    if(['changes','exRate','updatedAt','source'].includes(key)) return;
    const n=Number(value);
    if(Number.isFinite(n)&&n>0) prices[decodePriceKey(key)]=n;
  });
  const fx=Number(payload.exRate);
  if(Number.isFinite(fx)&&fx>0) exRate=fx;
  if(payload.changes&&typeof payload.changes==='object'){
    Object.entries(payload.changes).forEach(([key,value])=>{priceChanges[decodePriceKey(key)]=value;});
  }
}
function restoreLocalPriceCache(){
  try{mergePriceCache(JSON.parse(localStorage.getItem(PRICE_CACHE_KEY)||'null'));}catch(e){}
}
function saveLocalPriceCache(updatedAt=new Date().toISOString()){
  const numeric={};
  Object.entries(prices).forEach(([key,value])=>{
    const n=Number(value);
    if(Number.isFinite(n)&&n>0) numeric[key]=n;
  });
  try{localStorage.setItem(PRICE_CACHE_KEY,JSON.stringify({...numeric,exRate,changes:priceChanges,updatedAt}));}catch(e){}
}
restoreLocalPriceCache();

// 기록 품질 점수 — 클수록 신뢰도 높음. 부실한 값이 좋은 값을 덮지 못하게 하는 데 사용.
// complete(모두 실시간) > finalized(서버 확정) > stale 개수 적을수록
function recRank(r){
  if(!r) return -1;
  const finalized = r.provisional===false;
  const staleN = Array.isArray(r.stale) ? r.stale.length : 0;
  return (r.complete?2:0) + (finalized?1:0) - staleN*0.001;
}
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// 전일 대비 기준이 될 "직전 날짜의 신뢰 가능한 기록"
function prevDayRecord(){
  const ds=todayStr();
  const hist=live.history||[];
  for(let i=hist.length-1;i>=0;i--){ if(hist[i].date!==ds && hist[i].complete!==false) return hist[i]; }
  for(let i=hist.length-1;i>=0;i--){ if(hist[i].date!==ds) return hist[i]; }
  return null;
}
// history.total은 과거 버전에서 현금 포함 여부가 달랐다.
// 그래프와 변동 계산은 구성 필드로 재계산해 항상 투자자산만 사용한다.
function histInvest(h){
  if(!h) return 0;
  const parts=[h.crypto,h.stocks,h.etf];
  return parts.some(v=>Number.isFinite(Number(v)))
    ? parts.reduce((s,v)=>s+(Number(v)||0),0)
    : (Number(h.total)||0);
}

async function fetchSingleYF(ticker){
  const endpoints=[
    `https://query2.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=2d`,
    `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=2d`,
  ];
  const proxyFns=[
    u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  ];
  const parse=(d)=>{
    const meta=d?.chart?.result?.[0]?.meta;
    if(meta?.regularMarketPrice){
      const pct=meta.regularMarketChangePercent||
        (meta.chartPreviousClose?((meta.regularMarketPrice-meta.chartPreviousClose)/meta.chartPreviousClose*100):null);
      return {price:meta.regularMarketPrice, pct};
    }
    return null;
  };
  const attempt=async(url,ms)=>{
    const r=await fetchWithTimeout(url,ms);
    if(!r.ok) throw new Error('http');
    const v=parse(await r.json());
    if(!v) throw new Error('no-price');
    return v;
  };
  // Yahoo 2개 서버를 동시에 시도. 둘 다 실패하면 프록시 4개를 동시 시도한다.
  // 기존 순차 조회의 최악 30초 이상 대기를 약 6~7초 내로 줄인다.
  try{return await Promise.any(endpoints.map(url=>attempt(url,1800)));}catch(e){}
  const proxyUrls=endpoints.flatMap(url=>proxyFns.map(fn=>fn(url)));
  try{return await Promise.any(proxyUrls.map(url=>attempt(url,4500)));}catch(e){}
  return null;
}

// 검색은 등록할 때만 사용한다. 실제 시세 갱신은 아래의 기존 다중 공급원 체인이 담당한다.
let upbitMarketPromise=null;
let symbolCatalogPromise=null;
let symbolCatalogLoadError=false;
let smartSearchResults=[];

async function fetchFirstJSON(urls, directMs=2200, proxyMs=5000){
  const attempt=async(url,ms)=>{
    const r=await fetchWithTimeout(url,ms);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };
  try{return await Promise.any(urls.map(url=>attempt(url,directMs)));}catch(e){}
  const proxyFns=[
    u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  ];
  const proxied=urls.flatMap(url=>proxyFns.map(fn=>fn(url)));
  try{return await Promise.any(proxied.map(url=>attempt(url,proxyMs)));}catch(e){}
  return null;
}

async function loadUpbitMarkets(){
  if(!upbitMarketPromise){
    upbitMarketPromise=fetchFirstJSON(['https://api.upbit.com/v1/market/all?is_details=false'],3500,5000)
      .then(rows=>Array.isArray(rows)?rows.filter(row=>String(row.market||'').startsWith('KRW-')):[])
      .catch(()=>[]);
  }
  return upbitMarketPromise;
}

async function loadSymbolCatalog(){
  if(!symbolCatalogPromise){
    const bundled=window.ASSET_SYMBOL_CATALOG;
    if(Array.isArray(bundled?.items)&&bundled.items.length) return bundled.items;
    symbolCatalogPromise=fetchWithTimeout('./asset-symbols.json?v=20260906',6000,{cache:'no-store'})
      .then(response=>{
        if(!response.ok) throw new Error(`catalog HTTP ${response.status}`);
        return response.json();
      })
      .then(payload=>Array.isArray(payload?.items)?payload.items:[])
      .catch(error=>{symbolCatalogLoadError=true;console.warn('종목 검색 목록 로드 실패',error);return [];});
  }
  return symbolCatalogPromise;
}

function normalizedSearchText(value){
  return String(value||'').trim().toUpperCase().replace(/[\s._-]+/g,'');
}

async function searchSymbolCatalog(query){
  const items=await loadSymbolCatalog();
  const q=normalizedSearchText(query).replace(/^KRW/,'');
  if(!q) return [];
  return items.filter(item=>{
    const symbol=normalizedSearchText(item.market||item.ticker).replace(/^KRW/,'');
    return symbol.includes(q)||normalizedSearchText(item.name).includes(q)||normalizedSearchText(item.englishName).includes(q)||(item.aliases||[]).some(alias=>normalizedSearchText(alias).includes(q));
  }).sort((a,b)=>resultRank(a,query)-resultRank(b,query)).slice(0,30).map(item=>({...item,lookupSource:'daily-catalog'}));
}

function resultRank(item, rawQuery){
  const q=rawQuery.trim().toUpperCase();
  const symbol=String(item.market||item.ticker||'').replace(/^KRW-/,'').toUpperCase();
  const name=String(item.name||'').toUpperCase();
  const aliases=(item.aliases||[]).map(alias=>String(alias).toUpperCase());
  if(aliases.includes(q)) return 0;
  if(symbol===q||name===q) return 0;
  if(aliases.some(alias=>alias.startsWith(q))) return 1;
  if(symbol.startsWith(q)||name.startsWith(q)) return 1;
  if(aliases.some(alias=>alias.includes(q))) return 2;
  if(symbol.includes(q)||name.includes(q)) return 2;
  return 3;
}

async function searchUpbitAssets(query){
  const rows=await loadUpbitMarkets();
  const q=query.trim().toUpperCase().replace(/^KRW-/,'');
  if(!q) return [];
  return rows.filter(row=>{
    const symbol=String(row.market||'').replace(/^KRW-/,'').toUpperCase();
    const ko=String(row.korean_name||'').toUpperCase();
    const en=String(row.english_name||'').toUpperCase();
    return symbol.includes(q)||ko.includes(q)||en.includes(q);
  }).map(row=>({
    bucket:'crypto',name:row.korean_name||row.english_name||row.market,
    market:row.market,currency:'KRW',exchange:'UPBIT',lookupSource:'upbit',
  }));
}

async function searchNaverAssets(query){
  const encoded=encodeURIComponent(query.trim());
  if(!encoded) return [];
  const url=`https://m.stock.naver.com/front-api/search/autoComplete?query=${encoded}&target=stock,ipo`;
  const data=await fetchFirstJSON([url],3000,5000);
  return (data?.result?.items||[]).filter(row=>row.code&&row.category==='stock').map(row=>{
    const domestic=row.nationCode==='KOR'||/^(KOSPI|KOSDAQ)$/.test(String(row.typeCode||''));
    const ticker=domestic
      ? `${String(row.code).toUpperCase()}.${String(row.typeCode).toUpperCase()==='KOSDAQ'?'KQ':'KS'}`
      : String(row.code).toUpperCase();
    return {
      bucket:row.isEtf?'etf':'stocks',
      name:row.name||row.code,
      ticker,
      currency:domestic?'KRW':'USD',
      exchange:row.typeName||row.typeCode||'',
      quoteType:row.isEtf?'ETF':'EQUITY',
      naverCode:domestic?'':row.reutersCode||'',
      naverType:domestic?'':row.isEtf?'etf':'stock',
      lookupSource:'naver-search',
    };
  });
}

async function searchYahooAssets(query){
  const encoded=encodeURIComponent(query.trim());
  if(!encoded) return [];
  const urls=[
    `https://query1.finance.yahoo.com/v1/finance/search?q=${encoded}&quotesCount=15&newsCount=0&enableFuzzyQuery=true`,
    `https://query2.finance.yahoo.com/v1/finance/search?q=${encoded}&quotesCount=15&newsCount=0&enableFuzzyQuery=true`,
  ];
  const data=await fetchFirstJSON(urls);
  return (data?.quotes||[]).filter(row=>{
    const type=String(row.quoteType||row.typeDisp||'').toUpperCase();
    return (type==='EQUITY'||type==='ETF')&&row.symbol;
  }).map(row=>{
    const ticker=String(row.symbol).toUpperCase();
    const quoteType=String(row.quoteType||row.typeDisp||'').toUpperCase();
    const domestic=/\.(KS|KQ)$/.test(ticker);
    return {
      bucket:quoteType==='ETF'?'etf':'stocks',
      name:row.shortname||row.longname||ticker,
      ticker,
      currency:domestic?'KRW':String(row.currency||'USD').toUpperCase(),
      exchange:row.exchDisp||row.exchange||'',
      quoteType,
      lookupSource:'yahoo-search',
    };
  });
}

async function directTickerFallback(query){
  const raw=query.trim().toUpperCase();
  if(!/^[A-Z0-9][A-Z0-9.\-]{0,14}$/.test(raw)||raw.startsWith('KRW-')) return [];
  const candidates=/^[0-9A-Z]{6}$/.test(raw)&&!raw.includes('.')?[`${raw}.KS`,`${raw}.KQ`]:[raw];
  const checked=await Promise.all(candidates.map(async ticker=>({ticker,quote:await fetchSingleYF(ticker)})));
  const hit=checked.find(row=>row.quote?.price);
  if(!hit) return [];
  const domestic=/\.(KS|KQ)$/.test(hit.ticker);
  const known=NAVER_US[hit.ticker];
  return [{
    bucket:known?.type==='etf'?'etf':S.manageType==='etf'?'etf':'stocks',
    name:raw,
    ticker:hit.ticker,
    currency:domestic?'KRW':'USD',
    exchange:domestic?(hit.ticker.endsWith('.KQ')?'KOSDAQ':'KOSPI'):'',
    quoteType:'',lookupSource:'price-validation',
  }];
}

function smartResultLabel(item){
  if(item.bucket==='crypto') return '코인';
  if(item.bucket==='etf') return item.currency==='KRW'?'국내 ETF':'해외 ETF';
  return item.currency==='KRW'?'국내주식':'해외주식';
}

function renderSmartSearchResults(results, message){
  const status=document.getElementById('smartStatus');
  const box=document.getElementById('smartResults');
  if(status) status.textContent=message||'';
  if(!box) return;
  box.replaceChildren();
  box.style.display=results.length?'block':'none';
  results.forEach((item,index)=>{
    const button=document.createElement('button');
    button.type='button';button.className='smart-result';
    button.addEventListener('click',()=>chooseSmartAsset(index));
    const left=document.createElement('div');left.style.minWidth='0';
    const name=document.createElement('div');name.className='smart-result-name';name.textContent=item.name;
    const sub=document.createElement('div');sub.className='smart-result-sub';
    sub.textContent=[item.market||item.ticker,item.exchange,item.currency].filter(Boolean).join(' · ');
    const type=document.createElement('span');type.className='smart-result-type';type.textContent=smartResultLabel(item);
    left.append(name,sub);button.append(left,type);box.append(button);
  });
}

async function smartSearchAssets(){
  const input=document.getElementById('smartQuery');
  const button=document.getElementById('smartSearchButton');
  const query=(input?.value||'').trim();
  if(!query){input?.focus();renderSmartSearchResults([],'회사명, 티커 또는 코인명을 입력해주세요.');return;}
  if(button){button.disabled=true;button.textContent='검색 중';}
  renderSmartSearchResults([],'업비트·국내외 종목 목록을 확인하고 있어요…');
  try{
    let results=await searchSymbolCatalog(query);
    if(!results.length){
      const settled=await Promise.allSettled([searchUpbitAssets(query),searchNaverAssets(query),searchYahooAssets(query)]);
      results=settled.flatMap(row=>row.status==='fulfilled'?row.value:[]);
    }
    if(!results.length) results=await directTickerFallback(query);
    const seen=new Set();
    results=results.filter(item=>{
      const key=`${item.bucket}:${item.market||item.ticker}`;
      if(seen.has(key)) return false;seen.add(key);return true;
    }).sort((a,b)=>resultRank(a,query)-resultRank(b,query)).slice(0,12);
    smartSearchResults=results;
    const emptyMessage=symbolCatalogLoadError
      ? '종목 검색 목록을 불러오지 못했어요. 앱 배포 파일을 확인해주세요.'
      : '검색 결과가 없어요. 티커를 확인하거나 직접 추가를 이용해주세요.';
    renderSmartSearchResults(results,results.length?`${results.length}개를 찾았어요. 정확한 자산을 선택하세요.`:emptyMessage);
  }catch(e){
    smartSearchResults=[];
    renderSmartSearchResults([],'검색 연결이 원활하지 않아요. 잠시 후 다시 시도하거나 직접 추가해주세요.');
  }finally{
    if(button){button.disabled=false;button.textContent='검색';}
  }
}

function chooseSmartAsset(index){
  const item=smartSearchResults[index];
  if(!item) return;
  S.manageType=item.bucket;
  const {bucket,aliases,englishName,...prefill}=item;
  S.prefillAsset=prefill;
  S.showSmartAdd=false;S.showForm=true;S.editId=null;
  render();
  setTimeout(()=>document.getElementById('fQty')?.focus(),80);
}

// 네이버 해외주식 폴링: 종목별 Yahoo 호출 대신 주식/ETF 각 1회로 묶어 조회.
// 무료 프록시 하나가 느려도 다른 경로가 먼저 성공하면 즉시 반영한다.
async function fetchNaverUsBatch(items){
  const loadGroup=async(type)=>{
    const group=items.filter(item=>{
      const known=item.naverCode?{code:item.naverCode,type:item.naverType||'stock'}:NAVER_US[item.ticker];
      return known?known.type===type:true;
    }).map(item=>{
      const known=item.naverCode?{code:item.naverCode,type:item.naverType||'stock'}:NAVER_US[item.ticker];
      return {item,codes:known?[known.code]:[`${item.ticker}.O`,`${item.ticker}.K`]};
    });
    if(!group.length) return;
    const codes=[...new Set(group.flatMap(entry=>entry.codes))].join(',');
    const target=`https://polling.finance.naver.com/api/realtime/worldstock/${type}/${codes}`;
    const urls=[
      target,
      `https://corsproxy.io/?url=${encodeURIComponent(target)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,
    ];
    const attempt=async url=>{
      const r=await fetchWithTimeout(url,5000);
      if(!r.ok) throw new Error('http');
      const d=await r.json();
      if(!Array.isArray(d?.datas)||!d.datas.length) throw new Error('no-data');
      return d.datas;
    };
    let rows;
    try{rows=await Promise.any(urls.map(attempt));}catch(e){return;}
    rows.forEach(row=>{
      const entry=group.find(candidate=>candidate.codes.includes(row.reutersCode)||candidate.item.ticker===row.symbolCode);
      const item=entry?.item;
      const p=Number(row.closePriceRaw||String(row.closePrice||'').replace(/,/g,''));
      if(item&&p>0){
        prices[item.ticker]=p;
        freshKeys.add(item.ticker);
        const pct=Number(row.fluctuationsRatioRaw||row.fluctuationsRatio);
        if(Number.isFinite(pct)) priceChanges[item.ticker]=row.compareToPreviousPrice?.code==='5'?-Math.abs(pct):Math.abs(pct);
      }
    });
    render();
  };
  await Promise.allSettled([loadGroup('stock'),loadGroup('etf')]);
}

function startAutoRefresh(){

  autoRefreshId=setInterval(()=>{if(!S.showForm&&!priceUpdateInFlight) updatePrices();}, 5*60*1000);
}

async function updatePrices(forceRecord=false){
  if(priceUpdateInFlight)return;
  priceUpdateInFlight=true;
  const runId=++priceUpdateSeq;
  S.loading=true;
  freshKeys=new Set(); // 이번 회차에 실제로 갱신된 시세만 추적
  const lu=document.getElementById('lastUpdate');
  if(lu) lu.textContent='업데이트 중...';
  render();

  // 1. 업비트 코인
  let coinOk=false;
  try{
    if(live.crypto.length){
      const markets=live.crypto.map(c=>c.market).join(',');
      const r=await fetchWithTimeout(`https://api.upbit.com/v1/ticker?markets=${markets}`,5000);
      const d=await r.json();
      if(Array.isArray(d)&&d.length){
        d.forEach(item=>{
          prices[item.market]=item.trade_price;
          freshKeys.add(item.market);
          if(item.signed_change_rate!=null) priceChanges[item.market]=item.signed_change_rate*100;
        });
        coinOk=true;
      }
    }else coinOk=true;
  }catch(e){}

  // 업비트 실패 → 빗썸 백업
  if(!coinOk&&live.crypto.length){
    try{
      const r=await fetchWithTimeout('https://api.bithumb.com/public/ticker/ALL_KRW',5000);
      const d=await r.json();
      if(d.status==='0000'&&d.data){
        live.crypto.forEach(c=>{
          const sym=c.market.replace('KRW-','');
          if(d.data[sym]?.closing_price){
            prices[c.market]=parseFloat(d.data[sym].closing_price);
            freshKeys.add(c.market);
            if(d.data[sym].fluctate_rate_24H) priceChanges[c.market]=parseFloat(d.data[sym].fluctate_rate_24H);
            coinOk=true;
          }
        });
      }
    }catch(e){}
  }

  // 2. 환율
  let fxOk=false;
  for(const src of ['https://quotation-api-cdn.dunamu.com/v1/forex/recent?codes=FRX.KRWUSD','https://api.exchangerate-api.com/v4/latest/USD']){
    try{
      const r=await fetchWithTimeout(src,4000);const d=await r.json();
      if(d.basePrice){exRate=d.basePrice;fxOk=true;break;}
      if(d.rates?.KRW){exRate=d.rates.KRW;fxOk=true;break;}
    }catch(e){}
  }

  // 3. 국내 ETF: 네이버 금융 API (더 신뢰성 높음)
  const allTradeItems=[...live.stocks,...live.etf].filter(item=>!item.manual&&item.ticker);
  const domesticItems=allTradeItems.filter(item=>item.ticker.endsWith('.KS')||item.ticker.endsWith('.KQ'));
  const foreignItems=allTradeItems.filter(item=>!item.ticker.endsWith('.KS')&&!item.ticker.endsWith('.KQ'));
  const unknownForeign=foreignItems.filter(item=>!item.naverCode&&!NAVER_US[item.ticker]);

  // 코인/환율은 즉시 표시하고 로딩 UI를 풀어준다.
  // priceUpdateInFlight는 계속 true이므로 남은 주식 조회와 중복 실행되지 않는다.
  S.loading=false;
  render();

  // 국내 ETF/주식은 JSONP 한 번으로 묶어서 조회한다.
  // file://에서도 CORS 프록시 없이 작동하며, 개별 API 여러 번보다 빠르다.
  const naverBatchFetch=(items)=>new Promise(resolve=>{
    if(!items.length){resolve(new Set());return;}
    const cb=`__naverPrice_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const script=document.createElement('script');
    const done=new Set();
    let timer;
    const cleanup=()=>{clearTimeout(timer);script.remove();try{delete window[cb];}catch(e){window[cb]=undefined;}};
    const finish=()=>{cleanup();render();resolve(done);};
    window[cb]=(payload)=>{
      const rows=(payload?.result?.areas||[]).flatMap(area=>area.datas||[]);
      rows.forEach(row=>{
        const item=items.find(i=>i.ticker.replace(/\.(KS|KQ)$/,'')===String(row.cd));
        const p=Number(row.nv);
        if(item&&p>0){
          prices[item.ticker]=p;
          freshKeys.add(item.ticker);
          done.add(item.ticker);
          if(row.cr!=null) priceChanges[item.ticker]=(String(row.rf)==='5'?-1:1)*Math.abs(Number(row.cr));
        }
      });
      finish();
    };
    script.onerror=finish;
    timer=setTimeout(finish,3500);
    const codes=items.map(i=>i.ticker.replace(/\.(KS|KQ)$/,'')).join(',');
    script.src=`https://polling.finance.naver.com/api/realtime?query=${encodeURIComponent('SERVICE_ITEM:'+codes)}&_callback=${cb}`;
    document.head.appendChild(script);
  });

  const naverPromise=naverBatchFetch(domesticItems);

  // 해외주식은 네이버 일괄 조회가 1순위. 매핑 없는 신규 티커만 Yahoo를 바로 시도한다.
  const naverUsPromise=fetchNaverUsBatch(foreignItems);
  const yfPromises=unknownForeign.map(item=>
    fetchSingleYF(item.ticker).then(result=>{
      if(result){prices[item.ticker]=result.price;freshKeys.add(item.ticker);if(result.pct!=null)priceChanges[item.ticker]=result.pct;render();}
    }).catch(()=>{})
  );

  await Promise.allSettled([naverPromise,naverUsPromise,...yfPromises]);

  // 네이버 실패한 ETF는 Yahoo Finance로 재시도 (.KS와 .KQ 모두 시도)
  const naverFailed=domesticItems.filter(i=>!freshKeys.has(i.ticker));
  if(naverFailed.length){
    await Promise.allSettled(naverFailed.map(async item=>{
      // .KS 시도
      let result=await fetchSingleYF(item.ticker).catch(()=>null);
      if(result){prices[item.ticker]=result.price;freshKeys.add(item.ticker);if(result.pct!=null)priceChanges[item.ticker]=result.pct;render();return;}
      // .KQ로도 시도 (KOSDAQ)
      const kqTicker=item.ticker.replace('.KS','.KQ');
      result=await fetchSingleYF(kqTicker).catch(()=>null);
      if(result){prices[item.ticker]=result.price;freshKeys.add(item.ticker);if(result.pct!=null)priceChanges[item.ticker]=result.pct;render();}
    }));
  }

  // 네이버 해외 일괄 조회에서 누락된 종목만 Yahoo로 최종 보완한다.
  const foreignFailed=foreignItems.filter(item=>!freshKeys.has(item.ticker));
  if(foreignFailed.length){
    await Promise.allSettled(foreignFailed.map(item=>fetchSingleYF(item.ticker).then(result=>{
      if(result){prices[item.ticker]=result.price;freshKeys.add(item.ticker);if(result.pct!=null)priceChanges[item.ticker]=result.pct;render();}
    }).catch(()=>{})));
  }

  const now=new Date();
  const timeStr=`${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  saveLocalPriceCache(now.toISOString());
  // 이번 조회에서 성공한 필드만 갱신한다. 부분 실패가 서버의 마지막 정상가를
  // 통째로 지우는 기존 set() 동작을 막는다.
  if(db&&ROOM){
    const encodedChanges={};
    Object.entries(priceChanges).forEach(([key,value])=>{encodedChanges[encodePriceKey(key)]=value;});
    const patch={changes:encodedChanges,updatedAt:now.toISOString(),source:'browser'};
    freshKeys.forEach(key=>{if(Number.isFinite(Number(prices[key]))) patch[encodePriceKey(key)]=Number(prices[key]);});
    if(fxOk&&Number.isFinite(Number(exRate))) patch.exRate=Number(exRate);
    db.ref(`assets/${ROOM}/prices`).update(patch);
  }

  // 오늘 자산 기록 (하이브리드 임시값)
  //  · 실패한 종목은 마지막 정상가(prices에 남아있는 이전 값)로 폴백 → 0으로 사라지지 않음
  //  · 모든 자산에 값이 있고(폴백 포함) 최소 1개는 실시간일 때만 기록
  //  · complete/stale 품질 메타를 남기고, 더 좋은 기록을 부실값으로 덮지 않음
  //  · provisional:true — 밤에 서버(record.js)가 최종 확정값으로 덮어씀
  function tryRecord(force=false){
    if(!coinOk) return false; // 코인 미로드면 강제 새로고침이어도 기록 금지
    const items=[...live.stocks,...live.etf].filter(i=>!i.manual);
    const needed=[...live.crypto.map(c=>c.market), ...items.map(i=>i.ticker)];
    const needsFx=needsExchangeRate(items);
    const missing=needed.filter(k=>prices[k]==null);      // 실시간도 폴백도 없는 자산
    if(needsFx&&exRate==null) missing.push('USD/KRW');
    const fresh=needed.filter(k=>freshKeys.has(k));         // 이번에 실시간 갱신됨
    const stale=needed.filter(k=>prices[k]!=null && !freshKeys.has(k)); // 폴백(과거값) 사용
    if(needsFx&&exRate!=null&&!fxOk) stale.push('USD/KRW');
    if(missing.length) return false;                         // 값 없는 자산은 절대 기록하지 않음
    if(!fresh.length) return false;                          // 전부 낡은 값이면 보류(유령 기록 방지)

    const t3=calcTotals(allAssets());
    if(!t3.hasPrice) return false;
    const ds=todayStr();
    const entry={
      date:ds,
      total:Math.round(t3.crypto+t3.stocks+t3.etf),crypto:Math.round(t3.crypto),
      stocks:Math.round(t3.stocks),etf:Math.round(t3.etf),cash:Math.round(t3.cash),
      complete: missing.length===0 && stale.length===0,
      stale, source:'app', provisional:true, ts:new Date().toISOString()
    };
    const ha=[...(live.history||[])];
    const ei=ha.findIndex(h=>h.date===ds);
    if(ei>=0){
      const old=ha[ei];
      // 서버 확정값이 같거나 더 좋으면 절대 건드리지 않음
      if(old.provisional===false && recRank(old)>=recRank(entry)) return false;
      // 그 외엔 더 나빠지는 덮어쓰기 금지(수동 새로고침 force 제외)
      if(!force && recRank(old)>recRank(entry)) return false;
      ha[ei]=entry;
    }else ha.push(entry);
    ha.sort((a,b)=>a.date>b.date?1:-1);
    fbSave('history',ha);
    return true;
  }
  tryRecord(forceRecord);

  const lu2=document.getElementById('lastUpdate');
  const items=[...live.stocks,...live.etf].filter(i=>!i.manual);
  const loaded=items.filter(i=>freshKeys.has(i.ticker)).length;
  if(lu2){
    const parts=[];
    if(coinOk) parts.push('코인✓');
    if(fxOk) parts.push('환율✓');
    parts.push(`주식 ${loaded}/${items.length}${loaded===items.length?'✓':'⋯'}`);
    lu2.textContent=`${timeStr} ${parts.join(' ')}`;
  }
  priceUpdateInFlight=false;
  render();
  startAutoRefresh();

  // 5초 후 미로드 티커만 일괄 재시도 → 성공하면 기록 업데이트
  setTimeout(async ()=>{
    if(runId!==priceUpdateSeq) return; // 더 최근 업데이트가 시작됐으면 이전 재시도는 폐기
    // 캐시 가격이 있어도 이번 회차에 실시간 조회가 실패했으면 재시도한다.
    const missing=[...live.stocks,...live.etf].filter(i=>!i.manual&&!freshKeys.has(i.ticker));
    if(!missing.length) return;
    const domestic=missing.filter(item=>item.ticker.endsWith('.KS')||item.ticker.endsWith('.KQ'));
    await naverBatchFetch(domestic);
    const foreign=missing.filter(item=>!item.ticker.endsWith('.KS')&&!item.ticker.endsWith('.KQ'));
    await fetchNaverUsBatch(foreign);
    const stillMissing=missing.filter(item=>!freshKeys.has(item.ticker));
    await Promise.allSettled(stillMissing.map(item=>
      fetchSingleYF(item.ticker).then(r=>{if(r){prices[item.ticker]=r.price;freshKeys.add(item.ticker);if(r.pct!=null)priceChanges[item.ticker]=r.pct;}}).catch(()=>{})
    ));
    // 재시도 후 기록 시도 (아직 오늘 기록 없으면)
    tryRecord(false);
    render();
    const lu3=document.getElementById('lastUpdate');
    if(lu3){
      const it=[...live.stocks,...live.etf].filter(i=>!i.manual);
      const ld=it.filter(i=>freshKeys.has(i.ticker)).length;
      lu3.textContent=lu3.textContent.replace(/주식 \d+\/\d+[✓⋯]/,`주식 ${ld}/${it.length}${ld===it.length?'✓':'⚠'}`);
    }
  }, 5000);
}

  });

        crypto:SEED_CRYPTO,stocks:SEED_STOCKS,etf:SEED_ETF,cash:SEED_CASH,history:[],portfolios:[DEFAULT_PORTFOLIO]
      },()=>{

        updatePrices(); // 시드 데이터 저장 후 가격 로드
      });
    }else{
      db.ref(`assets/${ROOM}`).on('value',s=>{
        const v=s.val();
        if(v){
          live.crypto=v.crypto||SEED_CRYPTO;
          live.stocks=v.stocks||SEED_STOCKS;
          const rawEtf=v.etf||SEED_ETF;
          live.etf=rawEtf.map(item=>ETF_TICKER_FIX[item.ticker]?{...item,ticker:ETF_TICKER_FIX[item.ticker]}:item);
          // 기존 Firebase의 잘못된 ETF 코드만 수량/매입가를 유지한 채 1회 교정한다.
          if(live.etf.some((item,i)=>item.ticker!==rawEtf[i]?.ticker)) db.ref(`assets/${ROOM}/etf`).set(live.etf);
          live.cash=v.cash||SEED_CASH;
          live.history=v.history||[];
          live.portfolios=normalizePortfolios(v.portfolios);
          if(v.prices){
            mergePriceCache(v.prices);
            saveLocalPriceCache(v.prices.updatedAt);
          }
          if(!S.showForm) render();
          // Firebase 데이터 첫 로드 완료 후에 가격 업데이트
          if(firstLoad){
            firstLoad=false;
            updatePrices();
          }
        }
      });
    }
  });
}

function totalDelta(t){
  const prev=prevDayRecord();
  const assets=allAssets();
  const expected=assets.crypto.length+assets.stocks.filter(item=>!item.manual).length+assets.etf.filter(item=>!item.manual).length;
  const valued=assets.crypto.filter(item=>calcAssetVal(item,'crypto')!=null).length+assets.stocks.filter(item=>!item.manual&&calcAssetVal(item,'stock')!=null).length+assets.etf.filter(item=>!item.manual&&calcAssetVal(item,'etf')!=null).length;
  if(!prev||prev.complete===false||!t.hasPrice||valued!==expected) return null;
  const yesterday=histInvest(prev)+t.cash;
  const current=t.total;
  const diff=current-yesterday;
  return {diff,pct:yesterday?diff/yesterday*100:0};
}

function portfolioDailyDelta(){
  const assets=scopedAssets();
  const expectedPriced=assets.crypto.length+assets.stocks.filter(item=>!item.manual).length+assets.etf.filter(item=>!item.manual).length;
  let currentTotal=0,previousTotal=0,priced=0,valued=0;
  [['crypto','crypto'],['stocks','stock'],['etf','etf']].forEach(([bucket,type])=>assets[bucket].forEach(item=>{
    if(item.manual)return;
    const current=calcAssetVal(item,type);
    if(current==null)return;
    valued++;
    const key=type==='crypto'?item.market:item.ticker;
    const pct=Number(priceChanges[key]);
    currentTotal+=current;
    if(Number.isFinite(pct)&&pct>-100){previousTotal+=current/(1+pct/100);priced++;}
  }));
  assets.cash.forEach(item=>{const amount=Number(item.amount)||0;currentTotal+=amount;previousTotal+=amount;});
  if(!expectedPriced||valued!==expectedPriced||priced!==expectedPriced||!previousTotal)return null;
  const diff=currentTotal-previousTotal;
  return {diff,pct:diff/previousTotal*100,previousTotal};
}

function renderHistory(t){
  const hist=[...live.history].sort((a,b)=>a.date>b.date?1:-1);
  const periods=['1W','1M','3M','1Y','ALL'];
  const periodLabel={'1W':'1주','1M':'1달','3M':'3달','1Y':'1년','ALL':'전체'};
  let h='';

  // 기간 탭
  h+=`<div class="period-tabs">
    ${periods.map(p=>`<button class="period-tab ${S.chartPeriod===p?'on':''}" onclick="setCP('${p}')">${periodLabel[p]}</button>`).join('')}
  </div>`;

  // 투자금 변동 차트만
  h+=renderChart(hist, S.chartPeriod, 'invest');

  // 최근 기록 목록
  const recentAll=[...hist].reverse();
  const recent=S.showAllHistory?recentAll:recentAll.slice(0,5);
  h+=`<div class="record-list"><div class="record-head"><b>최근 기록</b><button onclick="clearHistory()">${hist.length}일 · 전체 삭제</button></div>`;
  recent.forEach((item,i)=>{
    const prev=recentAll[i+1];
    const itemTotal=histInvest(item);
    const prevTotal=histInvest(prev);
    const diff=prev?itemTotal-prevTotal:0;
    const pct=prev&&prevTotal?((diff/prevTotal)*100).toFixed(1):'';
    const qualityLabel=item.complete===false?'보정':item.provisional===true?'오늘':'';
    h+=`<div class="hist-item">
      <div>
        <div class="hist-date">${item.date}${qualityLabel?` <span title="${item.complete===false?'일부 시세를 마지막 정상값으로 보정함':'서버 확정 전 오늘의 실시간 기록'}" style="font-size:9px;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 4px;vertical-align:middle">${qualityLabel}</span>`:''}</div>
        ${prev?`<div class="hist-change ${diff>=0?'up':'dn'}">${diff>=0?'▲':'▼'} ${fmtWShort(Math.abs(diff))} (${pct}%)</div>`:'<div class="hist-change">—</div>'}
      </div>
      <div style="text-align:right">
        <div class="hist-total">${fmtWShort(itemTotal)}</div>
        <div style="font-size:10px;color:var(--text3)">코인 ${fmtS(item.crypto)} / 주식 ${fmtS(item.stocks+item.etf)}</div>
      </div>
    </div>`;
  });
  if(hist.length>5) h+=`<button class="history-toggle" onclick="toggleHistoryList()">${S.showAllHistory?'최근 5개만 보기 ↑':`나머지 ${hist.length-5}개 보기 ↓`}</button>`;
  h+=`</div><button class="record-btn" onclick="updatePrices(true)">오늘 자산 기록하기</button>`;
  return h;
}

function toggleHistoryList(){S.showAllHistory=!S.showAllHistory;render();}

function renderChart(hist, period, type){
  hist=hist.map(h=>({...h,total:type==='total' ? histInvest(h)+(Number(h.cash)||0) : histInvest(h)}));
  const now=new Date();
  let filtered=[...hist];
  const cutoff=new Date(now);
  if(period==='1W') cutoff.setDate(cutoff.getDate()-7);
  else if(period==='1M') cutoff.setMonth(cutoff.getMonth()-1);
  else if(period==='3M') cutoff.setMonth(cutoff.getMonth()-3);
  else if(period==='1Y') cutoff.setFullYear(cutoff.getFullYear()-1);
  if(period!=='ALL') filtered=hist.filter(h=>new Date(h.date)>=cutoff);
  if(!filtered.length) filtered=hist.slice(-7);
  if(filtered.length<2) return '<div class="empty">기록이 부족해요</div>';

  const firstVal=filtered[0].total;
  const lastVal=filtered[filtered.length-1].total;
  const diff=lastVal-firstVal;
  const pct=((diff/firstVal)*100).toFixed(2);
  const isUp=diff>=0;
  const clr=isUp?'var(--green)':'var(--red)';

  const W=360, H=130, PX=4, PY=10;
  const vals=filtered.map(h=>h.total);
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const range=mx-mn||1;
  const pts=filtered.map((h,i)=>{
    const x=PX+(i/(filtered.length-1))*(W-PX*2);
    const y=PY+(1-(h.total-mn)/range)*(H-PY*2);
    return [x.toFixed(1),y.toFixed(1)];
  });
  const polyline=pts.map(p=>p.join(',')).join(' ');
  const areaD=`M${pts[0][0]},${H-PY} `+pts.map(p=>`L${p[0]},${p[1]}`).join(' ')+` L${pts[pts.length-1][0]},${H-PY} Z`;

  // x축 레이블
  const nLabels=Math.min(5,filtered.length);
  const labelIdxs=[0,...Array.from({length:nLabels-2},(_, i)=>Math.round((i+1)*(filtered.length-1)/(nLabels-1))),filtered.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  const xLabels=labelIdxs.map(i=>{
    const x=PX+(i/(filtered.length-1))*(W-PX*2);
    const d=filtered[i].date;
    const label=period==='1W'?d.slice(5):period==='1Y'||period==='ALL'?d.slice(0,7):d.slice(5);
    return `<text x="${x.toFixed(0)}" y="${H+12}" text-anchor="middle" font-size="9" fill="var(--text3)">${label}</text>`;
  }).join('');

  // 최고/최저 표시
  const maxIdx=vals.indexOf(mx), minIdx=vals.indexOf(mn);
  const maxX=PX+(maxIdx/(filtered.length-1))*(W-PX*2);
  const minX=PX+(minIdx/(filtered.length-1))*(W-PX*2);

  return `<div class="chart-card">
    <div style="margin-bottom:10px">
      <div class="chart-eyebrow">현재 투자자산</div>
      <div class="chart-amount">${fmtW(lastVal)}</div>
      <div class="chart-delta ${isUp?'up':'dn'}">${isUp?'▲':'▼'} ${fmtWShort(Math.abs(diff))} (${Math.abs(pct)}%) · ${filtered[0].date.slice(0,7)} 대비</div>
    </div>
    <svg viewBox="0 0 ${W} ${H+16}" style="width:100%;overflow:visible">
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${clr}" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="${clr}" stop-opacity="0.01"/>
        </linearGradient>
      </defs>
      <path d="${areaD}" fill="url(#cg)"/>
      <polyline points="${polyline}" fill="none" stroke="${clr}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="${clr}"/>
      <text x="${Math.min(maxX,W-30)}" y="${parseFloat(pts[maxIdx][1])-5}" font-size="9" fill="var(--text3)" text-anchor="middle">${fmtS(mx)}</text>
      <text x="${Math.max(minX,30)}" y="${parseFloat(pts[minIdx][1])+13}" font-size="9" fill="var(--text3)" text-anchor="middle">${fmtS(mn)}</text>
      ${xLabels}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:4px">
      <span>최저 ${fmtWShort(mn)}</span>
      <span>최고 ${fmtWShort(mx)}</span>
    </div>
  </div>`;
}

      <div class="fr"><label>항목명</label><input id="fCashName" type="text" placeholder="예: 현금, 예금, 주택청약, CMA" value="${escHtml(item.name||'')}"></div>
      <div class="fr"><label>소속 포트폴리오</label>${portfolioSelect(item.portfolioId||(S.portfolioId==='all'?DEFAULT_PORTFOLIO_ID:S.portfolioId))}</div>
      <div class="fr"><label>금액 (원)</label><input id="fCashAmt" type="number" inputmode="numeric" placeholder="0" value="${item.amount||''}"></div>
      <div class="fr"><label>메모 (선택)</label><input id="fCashMemo" type="text" placeholder="예: KB은행, 국민은행" value="${escHtml(item.memo||'')}"></div>
      <div class="fa"><button class="btn-c" onclick="closeForm()">취소</button><button class="btn-s" onclick="saveCashItem()">${isE?'수정완료':'추가'}</button></div>
    </div>`;
  }

  if(!assets.cash.length){
    h+=`<div class="empty">현금, 예금, 주택청약 등을 추가해보세요</div>`;
  }else{
    h+=`<div class="asset-list">`;
    assets.cash.forEach(item=>{
      h+=`<div class="manage-item">
        <div class="mi-info">
          <div class="mi-name">${escHtml(item.name)}</div>
          <div class="mi-sub">${fmtW(item.amount||0)}${item.memo?' · '+escHtml(item.memo):''}</div>
        </div>
        <div class="mi-btns">
          <button class="mi-btn" onclick="openCashEdit('${item.id}')">수정</button>
          <button class="mi-btn d" onclick="delCash('${item.id}')">✕</button>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }
  return h;
}

// ── 이벤트 ──────────────────────────────────────────────────
function importSeedHistory(){
  if(!confirm(`엑셀 과거 기록 ${SEED_HISTORY.length}일치를 가져올까요?\n기존 기록과 합쳐집니다.`)) return;
  const existing=[...(live.history||[])];
  const merged={};
  existing.forEach(h=>merged[h.date]=h);
  SEED_HISTORY.forEach(h=>{if(!merged[h.date]) merged[h.date]=h;}); // 기존 기록 우선
  const arr=Object.values(merged).sort((a,b)=>a.date>b.date?1:-1);
  fbSave('history',arr);
  alert(`완료! ${arr.length}일치 기록이 저장됐어요.`);
  render();
}

function clearHistory(){
  if(!confirm('기록을 전부 삭제할까요?\n이 작업은 되돌릴 수 없어요.')) return;
  fbSave('history',[]);
  render();
}

function setV(v){S.view=v;if(v==='history')S.portfolioId='all';S.showForm=false;S.showSmartAdd=false;S.prefillAsset=null;S.editId=null;render();window.scrollTo(0,0);}
function setMT(t){S.manageType=t;S.showForm=false;S.showSmartAdd=false;S.prefillAsset=null;S.editId=null;render();}
function setCP(p){S.chartPeriod=p;render();}
function openSmartAdd(){S.showSmartAdd=true;S.showForm=false;S.prefillAsset=null;S.editId=null;render();setTimeout(()=>document.getElementById('smartQuery')?.focus(),80);}
function closeSmartAdd(){S.showSmartAdd=false;smartSearchResults=[];render();}
function openForm(id){S.showForm=true;S.showSmartAdd=false;S.prefillAsset=null;S.editId=id;render();setTimeout(()=>{const el=document.getElementById('fName')||document.getElementById('fCashName');if(el)el.focus();},80);}
function closeForm(){S.showForm=false;S.prefillAsset=null;S.editId=null;render();}
function openCashEdit(id){S.showForm=true;S.editId=id;render();setTimeout(()=>{const el=document.getElementById('fCashName');if(el)el.focus();},80);}

function saveItem(){
  const type=S.manageType;
  const items=[...live[type]||[]];
  const name=(document.getElementById('fName')?.value||'').trim();
  const qty=parseFloat(document.getElementById('fQty')?.value||'0')||0;
  const buyPrice=parseFloat(document.getElementById('fBuyPrice')?.value||'0')||0;
  const portfolioId=document.getElementById('fPortfolio')?.value||DEFAULT_PORTFOLIO_ID;
  if(!name){alert('이름을 입력해주세요');return;}
  let newItem={};
  const baseItem=S.editId?(items.find(i=>i.id===S.editId)||{}):(S.prefillAsset||{});
  if(type==='crypto'){
    const market=(document.getElementById('fMarket')?.value||'').trim().toUpperCase();
    if(!market){alert('마켓 코드를 입력해주세요');return;}
    newItem={...baseItem,id:S.editId||'c'+Date.now(),name,market,qty,portfolioId:document.getElementById('fPortfolio')?.value||DEFAULT_PORTFOLIO_ID};
    if(buyPrice>0) newItem.buyPrice=buyPrice;
    else delete newItem.buyPrice;
  }else{
    const ticker=(document.getElementById('fTicker')?.value||'').trim().toUpperCase();
    if(!ticker){alert('티커를 입력해주세요');return;}
    const currency=document.getElementById('fCurrency')?.value||(type==='etf'?'KRW':'USD');
    newItem={...baseItem,id:S.editId||(type==='etf'?'e':'s')+Date.now(),name,ticker,qty,currency,portfolioId};
    if(buyPrice>0) newItem.buyPrice=buyPrice;
    else delete newItem.buyPrice;
  }
  if(S.editId){
    const idx=items.findIndex(i=>i.id===S.editId);
    if(idx>=0) items[idx]=newItem;
  }else items.push(newItem);
  fbSave(type,items);
  S.showForm=false;S.prefillAsset=null;S.editId=null;
  render();
  // 새 자산 추가 시 가격 자동 업데이트
  setTimeout(()=>updatePrices(),300);
}

function delItem(id){
  if(!confirm('삭제할까요?'))return;
  const type=S.manageType;
  fbSave(type,(live[type]||[]).filter(i=>i.id!==id));
  render();
}

function openCashAdd(){S.showForm=true;S.editId=null;render();setTimeout(()=>{const el=document.getElementById('fCashName');if(el)el.focus();},80);}

function saveCashItem(){
  const name=(document.getElementById('fCashName')?.value||'').trim();
  const amount=parseFloat(document.getElementById('fCashAmt')?.value||'0')||0;
  const memo=(document.getElementById('fCashMemo')?.value||'').trim();
  if(!name){alert('항목명을 입력해주세요');return;}
  const arr=[...live.cash||[]];
  const base=S.editId?(arr.find(item=>item.id===S.editId)||{}):{};
  const newItem={...base,id:S.editId||'cash'+Date.now(),name,amount,memo,portfolioId:document.getElementById('fPortfolio')?.value||DEFAULT_PORTFOLIO_ID};
  if(S.editId){const idx=arr.findIndex(i=>i.id===S.editId);if(idx>=0)arr[idx]=newItem;}
  else arr.push(newItem);
  fbSave('cash',arr);
  S.showForm=false;S.editId=null;render();
}

function delCash(id){
  if(!confirm('삭제할까요?'))return;
  fbSave('cash',(live.cash||[]).filter(i=>i.id!==id));
  render();
}

// ── 포트폴리오 관리 ───────────────────────────────────────────
function portfolioAssetCount(id){return ['crypto','stocks','etf','cash'].reduce((sum,key)=>sum+(live[key]||[]).filter(item=>itemPortfolioId(item)===id).length,0);}
function persistPortfolioState(){
  live.portfolios=normalizePortfolios(live.portfolios);
  if(db&&ROOM) db.ref(`assets/${ROOM}`).update({portfolios:live.portfolios,crypto:live.crypto,stocks:live.stocks,etf:live.etf,cash:live.cash});
  render();
}
function openPortfolioManager(){document.getElementById('portfolioBackdrop')?.classList.add('open');renderPortfolioManager();}
function closePortfolioManager(){document.getElementById('portfolioBackdrop')?.classList.remove('open');S.portfolioEditId=null;}
function renderPortfolioManager(){
  const title=document.getElementById('portfolioSheetTitle'),body=document.getElementById('portfolioSheetBody');
  if(!title||!body)return;
  title.textContent='포트폴리오 관리';body.replaceChildren();
  const help=document.createElement('p');help.className='portfolio-help';help.textContent='기본 포트폴리오는 기존 자산과 삭제한 포트폴리오의 자산이 이동하는 곳입니다.';body.append(help);
  portfolios().forEach(p=>{
    const row=document.createElement('div');row.className='portfolio-manage-row';row.style.setProperty('--portfolio-color',p.color);
    const color=document.createElement('i');
    const info=document.createElement('span'),nameEl=document.createElement('b'),count=document.createElement('small');nameEl.textContent=p.name;count.textContent=`보유자산 ${portfolioAssetCount(p.id)}개`;info.append(nameEl);
    if(p.id===DEFAULT_PORTFOLIO_ID){const badge=document.createElement('em');badge.className='portfolio-default';badge.textContent='기본';nameEl.append(badge);}
    info.append(count);
    const actions=document.createElement('span');actions.className='portfolio-row-actions';
    const edit=document.createElement('button');edit.textContent='이름·색상';edit.addEventListener('click',()=>editPortfolio(p.id));actions.append(edit);
    const remove=document.createElement('button');
    if(p.id===DEFAULT_PORTFOLIO_ID){remove.textContent='삭제 불가';remove.disabled=true;}else{remove.textContent='삭제';remove.className='danger';remove.addEventListener('click',()=>deletePortfolio(p.id));}
    actions.append(remove);row.append(color,info,actions);body.append(row);
  });
  const add=document.createElement('button');add.className='portfolio-add';add.textContent='+ 새 포트폴리오 만들기';add.addEventListener('click',()=>editPortfolio(null));body.append(add);
}
function editPortfolio(id){
  const p=id?portfolios().find(row=>row.id===id):null;
  S.portfolioEditId=id;S.portfolioColor=p?.color||'#147a4b';
  document.getElementById('portfolioSheetTitle').textContent=p?'포트폴리오 수정':'새 포트폴리오';
  document.getElementById('portfolioSheetBody').innerHTML=`<div class="portfolio-form"><label for="portfolioName">이름</label><input id="portfolioName" maxlength="12" placeholder="예: 연금"><label>색상</label><div class="portfolio-colors">${['#147a4b','#3568bd','#9a7515','#8b5e9f'].map(color=>`<button class="portfolio-color ${color===S.portfolioColor?'on':''}" style="--choice:${color}" onclick="choosePortfolioColor('${color}',this)" aria-label="색상 선택"></button>`).join('')}</div><div class="portfolio-sheet-actions"><button class="portfolio-cancel" onclick="renderPortfolioManager()">취소</button><button class="portfolio-save" onclick="savePortfolio()">저장</button></div></div>`;
  const nameInput=document.getElementById('portfolioName');nameInput.value=p?.name||'';
  setTimeout(()=>nameInput.focus(),50);
}
function choosePortfolioColor(color,button){S.portfolioColor=safePortfolioColor(color);document.querySelectorAll('.portfolio-color').forEach(el=>el.classList.toggle('on',el===button));}
function savePortfolio(){
  const name=(document.getElementById('portfolioName')?.value||'').trim();
  if(!name){document.getElementById('portfolioName')?.focus();return;}
  const rows=[...portfolios()];
  if(S.portfolioEditId){const index=rows.findIndex(p=>p.id===S.portfolioEditId);if(index>=0)rows[index]={...rows[index],name,color:S.portfolioColor};}
  else rows.push({id:'p'+Date.now(),name,color:S.portfolioColor});
  live.portfolios=rows;persistPortfolioState();renderPortfolioManager();
}
function deletePortfolio(id){
  if(id===DEFAULT_PORTFOLIO_ID){alert('기본 포트폴리오는 삭제할 수 없어요');return;}
  const p=portfolios().find(row=>row.id===id);if(!p)return;
  const count=portfolioAssetCount(id);
  if(!confirm(`“${p.name}”을 삭제할까요?\n보유자산 ${count}개가 “기본 포트폴리오”로 이동됩니다.\n자산 자체는 삭제되지 않습니다.`))return;
  ['crypto','stocks','etf','cash'].forEach(key=>{live[key]=(live[key]||[]).map(item=>itemPortfolioId(item)===id?{...item,portfolioId:DEFAULT_PORTFOLIO_ID}:item);});
  live.portfolios=portfolios().filter(row=>row.id!==id);
  if(S.portfolioId===id)S.portfolioId=DEFAULT_PORTFOLIO_ID;
  persistPortfolioState();renderPortfolioManager();
}

document.addEventListener('keydown',event=>{if(event.key==='Escape')closePortfolioManager();});

// ── 공유 코드 ─────────────────────────────────────────────────
function setRoom(){
  const code=(document.getElementById('roomCodeInput').value||'').trim();
  if(!/^[A-Za-z0-9_-]{3,20}$/.test(code)){alert('공유 코드는 3~20자의 영문, 숫자, 밑줄(_), 하이픈(-)만 사용할 수 있어요.');return;}
  localStorage.setItem('asset_room',code);
  ROOM=code;
  document.getElementById('roomSetup').style.display='none';
  document.getElementById('mainApp').style.display='block';
  initFirebase();
  render();
  updatePrices();
}
function resetRoom(){
  if(!confirm('공유 코드를 초기화할까요?'))return;
  localStorage.removeItem('asset_room');
  location.reload();
}

// ── 시작 ─────────────────────────────────────────────────────
function startApp(){
  try{
    if(DEMO_MODE){
      document.getElementById('mainApp').style.display='block';
      S.view='manage';
      render();
      return;
    }
    if(!ROOM){
      const el=document.getElementById('roomSetup');
      if(el) el.style.display='flex';
    }else{
      const el=document.getElementById('mainApp');
      if(el) el.style.display='block';
      try{ initFirebase(); }catch(e){ console.error('Firebase init error:', e); }
      render();
      // updatePrices는 Firebase 데이터 로드 후 자동 실행됨
    }
  }catch(e){ console.error('startApp error:', e); }
}

// DOM이 준비됐으면 바로, 아니면 이벤트 대기
function waitForFirebaseAndStart(retries=20){
  if(typeof firebase!=='undefined'){
    startApp();
  }else if(retries>0){
    setTimeout(()=>waitForFirebaseAndStart(retries-1), 300);
  }else{
    console.error('Firebase SDK 로드 실패');
    startApp(); // Firebase 없이라도 시도
  }
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', ()=>waitForFirebaseAndStart());
}else{
  waitForFirebaseAndStart();
}
</script>
