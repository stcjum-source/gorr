name: 장중 자산 가격 갱신

on:
  # 정기 갱신은 Cloudflare Worker Cron이 담당한다.
  # 이 워크플로는 장애 시 수동 백업 실행용으로만 남긴다.
  workflow_dispatch:

concurrency:
  group: market-asset-prices
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install --omit=dev

      - name: Firebase 가격 캐시 갱신
        run: node record.js
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          PRICE_ONLY: '1'
