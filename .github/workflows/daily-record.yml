name: 자산 자동 기록

on:
  schedule:
    # 외부 시세 API 일시 장애에 대비해 같은 KST 날짜 안에 3회 시도.
    # 품질 점수가 더 나은 기록만 덮어쓰므로 중복 실행은 안전하다.
    - cron: '7,37 13 * * *' # 22:07, 22:37 KST
    - cron: '7 14 * * *'    # 23:07 KST
  workflow_dispatch: # GitHub 웹에서 수동 실행 가능

concurrency:
  group: daily-asset-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install --omit=dev

      - name: 자산 기록 실행
        run: node record.js
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
